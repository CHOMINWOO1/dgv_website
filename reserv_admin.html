<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Edit Group Reservations</title>
  <style>
    :root{
      --bg:#faf6ee; --card:#fffdf7; --ink:#3a2a1f; --sub:#6b5444;
      --line:#e7d7b8; --gold:#caa24c; --shadow:0 10px 24px rgba(0,0,0,.10);
      --radius:16px; --ok:#1b7f3a; --bad:#b42318;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{max-width:1280px;margin:18px auto;padding:0 12px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
    h1{margin:0;font-size:18px}
    .sub{margin:4px 0 0;color:var(--sub);font-size:12px}

    .controls{
      margin:12px 0 10px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
    }
    label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px}
    select,input,textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      outline:none;
    }
    textarea{min-height:92px;resize:vertical}
    button{
      border:0; cursor:pointer; border-radius:12px; padding:10px 12px;
      font-weight:900; letter-spacing:.02em;
    }
    .btn-confirm{
      background:#e9fff0;
      border:1px solid #bfe5c9;
      color:#1b7f3a;
    }
    .btn-confirm:hover{ filter:brightness(.98); }

    .btn-primary{background:var(--gold);color:#2b1e14}
    .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .btn-mini{border-radius:999px;padding:8px 10px}
    .btn-danger{
      background:#ffd9d7;
      border:1px solid #f4c7c3;
      color:var(--bad);
    }
    .btn-danger:hover{ filter:brightness(.98); }

    /* ✅ 확정 취소 버튼 */
    .btn-warn{
      background:#fff7e8;
      border:1px solid #efd7a6;
      color:#7a5a22;
    }
    .btn-warn:hover{ filter:brightness(.99); }

    .grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:12px;
      margin-top:10px;
    }

    /* list */
    .list{
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }
    .list-head{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background:#fff7e8;
      font-size:12px;
      color:var(--sub);
      font-weight:900;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .rows{max-height:70vh; overflow:auto}
    .row{
      padding:10px 12px;
      border-bottom:1px solid #f1e6cf;
      cursor:pointer;
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:flex-start;
    }
    .row:hover{background:#fffdf5}
    .row.active{background:#fff3d6}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 8px;border:1px solid var(--line);border-radius:999px;
      background:#fff;font-size:12px;font-weight:900;color:var(--sub);
      white-space:nowrap;
    }
    .pill-confirmed{
      border-color:#bfe5c9;
      background:#e9fff0;
      color:#1b7f3a;
    }

    .title{font-weight:1000}
    .muted{color:var(--sub);font-size:12px}
    .note-mini{
      margin-top:6px;
      color:var(--sub);
      font-size:12px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      white-space:pre-wrap;
    }

    /* editor */
    .editor{
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
    }
    .editor h2{margin:0 0 10px;font-size:14px}
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .span2{grid-column:1/-1}

    .time-row{display:flex;gap:10px;align-items:center}
    .time-row input{flex:1}
    .time-preview{
      min-width:86px;
      text-align:center;
      padding:10px 10px;
      border:1px dashed var(--line);
      border-radius:12px;
      color:var(--sub);
      font-weight:900;
      background:#fff;
    }

    .msg{margin-top:10px;font-size:14px}
    .ok{color:var(--ok);font-weight:900}
    .bad{color:var(--bad);font-weight:900}

    @media (max-width:980px){
      .grid{grid-template-columns:1fr}
      .rows{max-height:42vh}
    }

    /* ✅ NEW: MENU KO/VI 한 줄 + 결제 라디오 */
    .inline2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .radioRow{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
    }
    .radioRow label{
      margin:0;
      display:flex; align-items:center; gap:6px;
      font-weight:900; color:var(--ink); font-size:13px;
    }
    .radioRow input{ width:auto; }

    /* ===== Admin Password Modal ===== */
    .modalBack{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      display:none; align-items:center; justify-content:center;
      padding:14px; z-index:9999;
    }
    .modal{
      width:min(420px, 100%);
      background:var(--card);
      border:2px solid var(--line);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.20);
      padding:14px;
    }
    .modalTitle{font-weight:1000; margin:2px 0 10px;}
    .modalDesc{font-size:13px; color:var(--sub); font-weight:900; margin:0 0 10px;}
    .modalRow{display:flex; gap:8px; align-items:center;}
    .modalRow input{
      flex:1;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      font-weight:900;
    }
    .modalBtns{margin-top:10px; display:flex; gap:8px; justify-content:flex-end;}
    .btnModal{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-weight:1000;
      cursor:pointer;
    }
    .btnModal.primary{
      border-color:var(--gold);
      background:#fff7e6;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1>관리자 - 단체 예약 관리</h1>
        </div>
      </div>

      <div class="controls">
        <div style="min-width:220px">
          <label>BRANCH</label>
          <select id="q_branch">
            <option value="">전체</option>

        </div>

        <!-- ✅ 보기 모드 -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="display:flex;gap:8px;">
            <button class="btn-ghost btn-mini" id="btnToday" type="button">오늘</button>
            <button class="btn-primary btn-mini" id="btnFromToday" type="button">오늘 이후 전체</button>
            <button class="btn-ghost btn-mini" id="btnRange" type="button">기간</button>
          </div>

          <!-- ✅ 기간 입력 -->

            <div style="min-width:160px">
              <label>FROM</label>

        <button class="btn-ghost" id="btnRefresh" type="button">새로고침</button>
      </div>

      <div class="grid">
        <!-- LIST -->
        <div class="list">
          <div class="list-head">
            <span id="listTitle">목록</span>
            <span class="muted" id="listCount">0건</span>
          </div>
          <div class="rows" id="rows"></div>
        </div>

        <!-- EDITOR -->
        <div class="editor">
          <h2>선택된 예약 수정</h2>

          <div class="fgrid">
            <div>
              <label>ID</label>
              <input id="e_id" type="text" disabled />
            </div>
            <div>
  <label>BRANCH</label>

  <select id="e_branch_select"></select>

  <div id="e_branch_custom_box" style="margin-top:10px; display:none;">
    <input id="e_branch_custom" type="text" placeholder="BRANCH 직접입력 (예: ANT2 / DALAT)" />
    <div class="muted" style="margin-top:6px">* 커스텀 선택 시 입력한 값이 저장됨</div>
  </div>
</div>

            <div>
              <label>DATE</label>
              <input id="e_date" type="date" />
            </div>

            <div>
              <label>TIME (타이핑 → 10분 자동보정)</label>
              <div class="time-row">
                <input id="e_time_raw" type="text" inputmode="numeric" placeholder="예: 6 / 630 / 18:07" autocomplete="off" />
                <div class="time-preview" id="e_time_preview">--:--</div>
              </div>
            </div>

            <div>
              <label>GUESTS</label>
              <input id="e_guests" type="number" min="1" step="1" />
            </div>

            <div>
              <label>PRICE (VND)</label>
              <input id="e_price" type="number" min="0" step="1000" placeholder="예: 2500000" />
            </div>

            <!-- ✅ MENU KO/VI 한 줄 -->
            <div class="span2">
              <label>MENU (KO / VI)</label>
              <div class="inline2">
                <input id="e_menu_ko" type="text" placeholder="예: 무한삼겹" />
                <input id="e_menu_vi" type="text" placeholder="예: Thịt nướng buffet" />
              </div>
              <div class="muted" style="margin-top:6px">* KO 입력 시 매핑표에 있으면 VI 자동 입력</div>
            </div>

            <!-- ✅ 결제수단(orders.payment_method로 저장) -->
            <div class="span2">
              <label>PAYMENT METHOD</label>
              <div class="radioRow">
                <label><input type="radio" name="pay_method" value="cash" checked> cash</label>
                <label><input type="radio" name="pay_method" value="card"> card</label>
                <label><input type="radio" name="pay_method" value="bank"> bank</label>
              </div>
            </div>

            <!-- ✅ NOTE 위 추가 정보(orders.team_no로 저장) -->
            <div class="span2">
              <label>OPTIONAL INFO (TEAM / 메모)</label>
              <input id="e_optional_info" type="text" placeholder="예: Team 4.2 / 단체명 / 차량번호 등" />
            </div>

            <div class="span2">
              <label>NOTE</label>
              <textarea id="e_note"></textarea>
            </div>

            <div class="span2">
              <label>GUIDE NAME</label>
              <input id="e_guide" type="text" />
            </div>
          </div>

          <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
            <button class="btn-confirm" id="btnConfirm" type="button">확정</button>
            <button class="btn-warn" id="btnUnconfirm" type="button">확정취소</button>

            <button class="btn-ghost" id="btnClear" type="button">선택 해제</button>
            <button class="btn-primary" id="btnSave" type="button">저장(수정)</button>
            <button class="btn-danger" id="btnDelete" type="button">삭제</button>
          </div>

          <div class="msg" id="msg"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ 관리자 비밀번호 모달 -->
  <div class="modalBack" id="pwModal">
    <div class="modal">
      <div class="modalTitle">관리자 비밀번호</div>
      <p class="modalDesc">접근하려면 비밀번호를 입력하세요.</p>

      <div class="modalRow">
        <input id="pwInput" type="password" placeholder="비밀번호 입력" />
      </div>

      <div class="modalBtns">
        <button class="btnModal" id="pwCancel" type="button">취소</button>
        <button class="btnModal primary" id="pwOk" type="button">확인</button>
      </div>
    </div>
  </div>

  <script>
    /***********************
     * ✅ 너 프로젝트
     ***********************/
    const SUPABASE_URL = "https://qzuynzreamdkpmakvefm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_cr1uTfwC5-yOXoV8Ice1_w_3Eqg1cZ_";

    /***********************
     * ✅ 입장 비밀번호(세션)
     ***********************/
    let ADMIN_PW = "";
    const ADMIN_PASS_KEY = "hana_admin_pw_edit_v1";

    /***********************
     * 한→베 메뉴 매핑
     ***********************/
    const KO_VI_MENU_MAP = {
      '김치찌개': 'Canh kim chi',
      '제육볶음': 'Heo xào',
      '제육쌈밥': 'Heo xào',
      '삼겹살': 'Thịt nướng',
      '무한삼겹': 'Thịt nướng buffet',
      '무삼': 'Thịt nướng buffet',
      '아티소백숙': 'Gà hầm atiso',
      '제육+김치찌개': 'Canh kim chi+Heo xào',
      '우렁쌈밥': 'Ốc tương xào',
      '장어구이': 'Lươn nướng',
      '닭볶음탕' : 'Gà hầm cay',
      '소고기수육세트' : 'Set thịt bò luộc',
      '사시미세트' : 'bộ sashimi',
      '묵은지등갈비찜': 'Sườn heo om kim chi',
      '짬뽕순두부' : 'Món hầm Sun'
    };

    const BRANCH_PRESETS = ["KT","ANT","AST","엠투어","기쁨","JM","TOT","투어패밀리","빅트래블","실크로드","HANA","OTHER"];
    const $ = (id) => document.getElementById(id);

    function getPaymentMethod(){
      const el = document.querySelector('input[name="pay_method"]:checked');
      return el ? el.value : "cash";
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function setMsg(type, text){
      const el = $("msg");
      if(!text){ el.innerHTML = ""; return; }
      el.innerHTML = `<span class="${type}">${escapeHtml(text)}</span>`;
    }

    function ymd(d){ return d.toISOString().slice(0,10); }

    function formatVND(n){
      if(n === null || n === undefined || n === "") return "";
      const x = Number(n);
      if(!Number.isFinite(x) || x === 0) return "";
      return x.toLocaleString("en-US") + " VND";
    }

    /***********************
     * ✅ Password Modal Gate
     ***********************/
    function openPwModal(){
      $("pwModal").style.display = "flex";
      $("pwInput").value = "";
      setTimeout(()=> $("pwInput").focus(), 60);
    }
    function closePwModal(){
      $("pwModal").style.display = "none";
    }

    async function requireAdminPassword(){
      const cached = (sessionStorage.getItem(ADMIN_PASS_KEY) || "").trim();
      if(cached){
        ADMIN_PW = cached;
        return true;
      }

      return new Promise((resolve)=>{
        openPwModal();

        const ok = () => {
          const pw = ($("pwInput").value || "").trim();
          if(!pw) return;

          ADMIN_PW = pw;
          sessionStorage.setItem(ADMIN_PASS_KEY, pw);
          closePwModal();
          cleanup();
          resolve(true);
        };

        const cancel = () => {
          document.body.innerHTML =
            "<div style='padding:24px;font-family:system-ui'>접근이 취소되었습니다.</div>";
          cleanup();
          resolve(false);
        };

        const key = (e)=>{
          if(e.key === "Enter") ok();
          if(e.key === "Escape") cancel();
        };

        function cleanup(){
          $("pwOk").removeEventListener("click", ok);
          $("pwCancel").removeEventListener("click", cancel);
          $("pwInput").removeEventListener("keydown", key);
        }

        $("pwOk").addEventListener("click", ok);
        $("pwCancel").addEventListener("click", cancel);
        $("pwInput").addEventListener("keydown", key);
      });
    }

    /***********************
     * RPC / Fetch Helpers
     ***********************/
    async function rpc(fn, body){
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
        method:"POST",
        headers:{
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":"Bearer " + SUPABASE_ANON_KEY,
          "Content-Type":"application/json"
        },
        body: JSON.stringify(body || {})
      });
      const text = await res.text();
      let json=null; try{ json = text ? JSON.parse(text) : null; }catch{}
      if(!res.ok){
        const err = (json && (json.message || json.error)) || text || ("HTTP " + res.status);
        throw new Error(err);
      }
      return json;
    }

    async function fetchJson(url){
      const res = await fetch(url, {
        headers:{
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY
        }
      });
      const text = await res.text();
      let json=null; try{ json = text ? JSON.parse(text) : null; }catch{}
      if(!res.ok){
        const err = (json && (json.message || json.error)) || text || ("HTTP " + res.status);
        throw new Error(err);
      }
      return json;
    }

    function normalizeKey(s){
      return (s || "").trim().replace(/\s+/g, "");
    }

    /***********************
     * TIME 파서 + 10분 보정
     ***********************/
    function clamp(n, a, b){ return Math.min(b, Math.max(a, n)); }

    function parseLooseTimeToMinutes(raw){
      const s0 = (raw || "").trim();
      if(!s0) return null;

      const s = s0.replace(/\s+/g, "");
      let h = null, m = null;

      if(s.includes(":")){
        const parts = s.split(":");
        if(parts.length !== 2) return null;
        if(parts[0] === "") return null;
        h = Number(parts[0]);
        m = Number(parts[1]);
        if(!Number.isFinite(h) || !Number.isFinite(m)) return null;
      }else{
        if(!/^\d+$/.test(s)) return null;
        if(s.length <= 2){
          h = Number(s);
          m = 0;
        }else if(s.length === 3){
          h = Number(s.slice(0,1));
          m = Number(s.slice(1));
        }else if(s.length === 4){
          h = Number(s.slice(0,2));
          m = Number(s.slice(2));
        }else{
          return null;
        }
      }

      if(!Number.isFinite(h) || !Number.isFinite(m)) return null;
      if(h < 0 || h > 23) return null;
      if(m < 0 || m > 59) return null;

      return h * 60 + m;
    }

    function roundToNearest10(mins){
      const rounded = Math.round(mins / 10) * 10;
      return clamp(rounded, 0, 23*60 + 50);
    }

    function minutesToHHMM(mins){
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
    }

    function getNormalizedTimeHHMM(rawInputId){
      const mins = parseLooseTimeToMinutes($(rawInputId).value);
      if(mins === null) return null;
      const r = roundToNearest10(mins);
      return minutesToHHMM(r);
    }

    function updateTimePreview(rawId, prevId){
      const t = getNormalizedTimeHHMM(rawId);
      $(prevId).textContent = t || "--:--";
      $(prevId).style.opacity = t ? "1" : ".6";
    }

    /***********************
     * 목록 로드 모드
     ***********************/
    let MODE = "fromToday"; // today | fromToday | range
    let SELECTED_ID = null;
    let SELECTED_ROW = null;
    let ROWS = [];

    function setConfirmButtons(){
      const isConfirmed = !!(SELECTED_ROW && SELECTED_ROW.confirmed);
      $("btnConfirm").disabled = !SELECTED_ID || isConfirmed;
      $("btnUnconfirm").disabled = !SELECTED_ID || !isConfirmed;

      $("btnConfirm").style.opacity = $("btnConfirm").disabled ? ".45" : "1";
      $("btnUnconfirm").style.opacity = $("btnUnconfirm").disabled ? ".45" : "1";
      $("btnConfirm").style.cursor = $("btnConfirm").disabled ? "not-allowed" : "pointer";
      $("btnUnconfirm").style.cursor = $("btnUnconfirm").disabled ? "not-allowed" : "pointer";
    }

    function setMode(mode){
      MODE = mode;

      const on = (id) => {
        $(id).classList.add("btn-primary");
        $(id).classList.remove("btn-ghost");
      };
      const off = (id) => {
        $(id).classList.add("btn-ghost");
        $(id).classList.remove("btn-primary");
      };

      if(MODE === "today"){
        on("btnToday"); off("btnFromToday"); off("btnRange");
        $("listTitle").textContent = "오늘 예약";
        $("rangeBox").style.display = "none";
      }else if(MODE === "range"){
        off("btnToday"); off("btnFromToday"); on("btnRange");
        $("listTitle").textContent = "기간 조회";
        $("rangeBox").style.display = "flex";
      }else{
        off("btnToday"); on("btnFromToday"); off("btnRange");
        $("listTitle").textContent = "오늘 이후 전체";
        $("rangeBox").style.display = "none";
      }
    }

    function clearSelection(){
  SELECTED_ID = null;
  SELECTED_ROW = null;

  ["e_id","e_date","e_time_raw","e_guests","e_price","e_menu_ko","e_menu_vi","e_optional_info","e_note","e_guide"]
    .forEach(id => { if($(id)) $(id).value = ""; });

  // ✅ branch 초기화
  if($("e_branch_select")) $("e_branch_select").value = "ANT";
  if($("e_branch_custom")) $("e_branch_custom").value = "";
  if($("e_branch_custom_box")) $("e_branch_custom_box").style.display = "none";

  $("e_time_preview").textContent="--:--";
  document.querySelectorAll(".row.active").forEach(el => el.classList.remove("active"));

  const cash = document.querySelector('input[name="pay_method"][value="cash"]');
  if(cash) cash.checked = true;

  setMsg("", "");
  setConfirmButtons();
}


    function fillEditor(r){
      SELECTED_ID = r.id;
      SELECTED_ROW = r;
      $("e_id").value = r.id ?? "";
      setEditorBranchFromValue(r.branch ?? "");

      $("e_date").value = r.res_date ?? "";
      $("e_time_raw").value = (r.res_time || "").slice(0,5) || "";
      $("e_guests").value = r.guests_count ?? "";
      $("e_price").value = (r.price ?? "") === null ? "" : (r.price ?? "");
      $("e_menu_ko").value = r.menu_ko ?? "";
      $("e_menu_vi").value = r.menu_vi ?? "";
      $("e_note").value = r.note ?? "";
      $("e_guide").value = r.guide_name ?? "";
      // OPTIONAL INFO는 resv_groups에 없으니 편집값 유지용(선택시 초기화)
      $("e_optional_info").value = "";
      // payment method도 orders에서만 쓸 거라 선택시 기본 cash
      const cash = document.querySelector('input[name="pay_method"][value="cash"]');
      if(cash) cash.checked = true;

      updateTimePreview("e_time_raw","e_time_preview");
      setMsg("", "");
      setConfirmButtons();
    }

    function renderList(rows){
      const box = $("rows");
      $("listCount").textContent = `${rows.length}건`;

      if(!rows.length){
        box.innerHTML = `<div class="muted" style="padding:12px;">데이터 없음</div>`;
        return;
      }

      box.innerHTML = rows.map(r => {
        const note = (r.note || "").trim();
        const isConfirmed = !!r.confirmed;
        return `
          <div class="row" data-id="${escapeHtml(r.id)}">
            <div>
              <div class="title">${escapeHtml(r.res_date || "")} ${escapeHtml((r.res_time||"").slice(0,5))}</div>
              <div class="muted" style="margin-top:4px">
                <span class="pill">${escapeHtml(r.branch || "")}</span>
                <span class="pill">👥 ${escapeHtml(String(r.guests_count ?? ""))}</span>
                ${r.price ? `<span class="pill">${escapeHtml(formatVND(r.price))}</span>` : ``}
                ${isConfirmed ? `<span class="pill pill-confirmed">✅ CONFIRMED</span>` : ``}
              </div>
              <div class="muted" style="margin-top:6px">
                <span class="pill">GUIDE: ${escapeHtml(r.guide_name || "")}</span>
                ${isConfirmed && r.confirmed_order_id ? `<span class="pill">ORDER: ${escapeHtml(String(r.confirmed_order_id).slice(0,8))}…</span>` : ``}
              </div>
              <div class="note-mini">${escapeHtml(note)}</div>
            </div>
            <div style="text-align:right">
              <div class="muted">${escapeHtml(r.menu_ko || "")}</div>
              <div class="muted">${escapeHtml(r.menu_vi || "")}</div>
            </div>
          </div>
        `;
      }).join("");

      box.querySelectorAll(".row").forEach(el=>{
        el.addEventListener("click", ()=>{
          const id = el.getAttribute("data-id");
          document.querySelectorAll(".row.active").forEach(x => x.classList.remove("active"));
          el.classList.add("active");
          const r = ROWS.find(x => String(x.id) === String(id));
          if(r) fillEditor(r);
        });
      });

      if(SELECTED_ID !== null && SELECTED_ID !== undefined){
        const active = box.querySelector(`.row[data-id="${CSS.escape(String(SELECTED_ID))}"]`);
        if(active) active.classList.add("active");
      }
    }

    function setDefaultRange(){
      const today = new Date();
      const from = new Date(today);
      from.setDate(from.getDate() - 30);
      $("q_from").value = ymd(from);
      $("q_to").value = ymd(today);
    }

    async function loadList(opts){
      try{
        const preserveSelected = !!(opts && opts.preserveSelected);
        const prevId = preserveSelected ? SELECTED_ID : null;

        setMsg("", "");
        if(!preserveSelected) clearSelection();

        const today = ymd(new Date());
        const branch = $("q_branch").value;

        let url =
          `${SUPABASE_URL}/rest/v1/resv_groups` +
          `?select=id,res_date,res_time,guests_count,price,menu_ko,menu_vi,note,branch,guide_name,confirmed,confirmed_at,confirmed_order_id`;

        if(MODE === "today"){
          url += `&res_date=eq.${today}`;
        }else if(MODE === "range"){
          const from = $("q_from").value;
          const to = $("q_to").value;

          if(!from || !to){
            setMsg("bad","기간 조회는 FROM/TO 날짜가 필요해.");
            $("rows").innerHTML = `<div class="muted" style="padding:12px;">기간을 설정해줘</div>`;
            return;
          }
          if(from > to){
            setMsg("bad","FROM은 TO보다 클 수 없어.");
            $("rows").innerHTML = `<div class="muted" style="padding:12px;">FROM/TO 순서를 확인해줘</div>`;
            return;
          }

          const toNext = new Date(to + "T00:00:00");
          toNext.setDate(toNext.getDate() + 1);
          const toNextYmd = ymd(toNext);

          url += `&res_date=gte.${from}&res_date=lt.${toNextYmd}`;
        }else{
          url += `&res_date=gte.${today}`;
        }

        if(branch) url += `&branch=eq.${encodeURIComponent(branch)}`;
        url += `&order=res_date.asc,res_time.asc`;

        const rows = await fetchJson(url);
        ROWS = Array.isArray(rows) ? rows : [];

        if(preserveSelected && prevId !== null && prevId !== undefined){
          const rr = ROWS.find(x => String(x.id) === String(prevId));
          if(rr){
            SELECTED_ID = rr.id;
            SELECTED_ROW = rr;
            fillEditor(rr);
          }else{
            SELECTED_ID = null;
            SELECTED_ROW = null;
          }
        }

        renderList(ROWS);
        setConfirmButtons();
      }catch(e){
        $("rows").innerHTML = `<div class="muted" style="padding:12px;">조회 실패: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function confirmToOrders(){
      try{
        setMsg("", "");
        if(!SELECTED_ID || !SELECTED_ROW){
          setMsg("bad","확정할 예약을 왼쪽 목록에서 선택해줘.");
          return;
        }

        if(SELECTED_ROW.confirmed){
          setMsg("bad","이미 확정된 예약이야. (확정취소 후 다시 확정 가능)");
          return;
        }

        const ok = confirm("확정하면 orders로 매출이 생성됩니다. 진행할까요?");
        if(!ok) return;

        const res_date = $("e_date").value;
        const res_time = getNormalizedTimeHHMM("e_time_raw"); // HH:MM
        const guests_count = Number($("e_guests").value);
        const priceRaw = $("e_price").value;
        const price = priceRaw === "" ? null : Number(priceRaw); // VND(1인)

        const menu_ko = ($("e_menu_ko").value || "").trim();
        const menu_vi = ($("e_menu_vi").value || "").trim();
        const note = ($("e_note").value || "").trim();
        const guide_name = ($("e_guide").value || "").trim();

        const optional_info = ($("e_optional_info").value || "").trim(); // ✅ NEW
        const payment_method = getPaymentMethod(); // ✅ NEW

        if(!res_date || !res_time){
          setMsg("bad","DATE / TIME은 필수야");
          return;
        }
        if(!Number.isFinite(guests_count) || guests_count <= 0){
          setMsg("bad","GUESTS를 숫자로 입력해줘");
          return;
        }
        if(!Number.isFinite(price) || price <= 0){
          setMsg("bad","PRICE(VND) 값이 필요해");
          return;
        }
        if(!menu_ko){
          setMsg("bad","MENU KO는 필수야");
          return;
        }

        // KO->VI 자동 매핑 (비었으면)
        let final_vi = menu_vi;
        if(menu_ko && !final_vi){
          const mapped = KO_VI_MENU_MAP[normalizeKey(menu_ko)];
          if(mapped) final_vi = mapped;
        }

        const unit_vnd = Math.round(price);
        const qty = guests_count;
        const line_vnd = unit_vnd * qty;

        const created_at = `${res_date}T${res_time}:00+07:00`;

        // 1) orders insert -> id (payment_method + team_no 저장)
        const orderInsertUrl = `${SUPABASE_URL}/rest/v1/orders?select=id`;
        const orderRes = await fetch(orderInsertUrl, {
          method:"POST",
          headers:{
            "apikey": SUPABASE_ANON_KEY,
            "Authorization":"Bearer " + SUPABASE_ANON_KEY,
            "Content-Type":"application/json",
            "Prefer":"return=representation"
          },
          body: JSON.stringify({
            created_at,
            source: "reservation_confirm",
            status: "paid",
            total_usd: 0,
            total_vnd: line_vnd,
            guide_name: guide_name || null,
            team_no: optional_info || note || null,         // ✅ NEW
            payment_method: payment_method || "cash"        // ✅ NEW
          })
        });

        const orderText = await orderRes.text();
        if(!orderRes.ok){
          let j=null; try{ j = orderText ? JSON.parse(orderText) : null; }catch{}
          throw new Error((j && (j.message || j.error)) || orderText || ("HTTP " + orderRes.status));
        }

        const orderJson = orderText ? JSON.parse(orderText) : null;
        const orderId = Array.isArray(orderJson) ? orderJson[0]?.id : orderJson?.id;
        if(!orderId) throw new Error("orders insert 후 order id를 받지 못했어");

        // 2) order_custom_items insert (기존 유지)
        const customInsertUrl = `${SUPABASE_URL}/rest/v1/order_custom_items`;
        const cRes = await fetch(customInsertUrl, {
          method:"POST",
          headers:{
            "apikey": SUPABASE_ANON_KEY,
            "Authorization":"Bearer " + SUPABASE_ANON_KEY,
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            order_id: orderId,
            kind: "group_resv",
            ko_name: menu_ko,
            vi_name: final_vi || null,
            qty,
            unit_usd: 0,
            unit_vnd,
            line_usd: 0,
            line_vnd
          })
        });

        const cText = await cRes.text();
        if(!cRes.ok){
          let j=null; try{ j = cText ? JSON.parse(cText) : null; }catch{}
          throw new Error((j && (j.message || j.error)) || cText || ("HTTP " + cRes.status));
        }

        // 3) resv_groups -> confirmed 표시 (RPC)
        await rpc("admin_mark_resv_confirmed", {
          pw: ADMIN_PW,
          p_id: Number(SELECTED_ID),
          p_order_id: orderId
        });

        setMsg("ok", `확정 완료! ✅ (order: ${String(orderId).slice(0,8)}...)`);
        await loadList({ preserveSelected:true });
      }catch(e){
        if((e.message || "").toLowerCase().includes("forbidden")){
          setMsg("bad","권한이 없습니다(RLS/비번). 정책 또는 비밀번호를 확인해줘.");
        }else{
          setMsg("bad","확정 실패: " + e.message);
        }
      }
    }

    async function unconfirmReservation(){
      try{
        setMsg("", "");
        if(!SELECTED_ID || !SELECTED_ROW){
          setMsg("bad","확정취소할 예약을 왼쪽 목록에서 선택해줘.");
          return;
        }
        if(!SELECTED_ROW.confirmed){
          setMsg("bad","아직 확정되지 않은 예약이야.");
          return;
        }

        const ok = confirm("확정취소하면 orders 기록도 삭제합니다.\n진행할까요?");
        if(!ok) return;

        await rpc("admin_unmark_resv_confirmed", {
          pw: ADMIN_PW,
          p_id: Number(SELECTED_ID)
        });

        setMsg("ok","확정취소 완료!");
        await loadList({ preserveSelected:true });
      }catch(e){
        if((e.message || "").toLowerCase().includes("forbidden")){
          sessionStorage.removeItem(ADMIN_PASS_KEY);
          ADMIN_PW = "";
          setMsg("bad","비밀번호가 틀렸거나 권한이 없습니다. 다시 입력해줘.");
          const ok = await requireAdminPassword();
          if(ok) setMsg("bad","다시 확정취소 버튼을 눌러줘.");
        }else{
          setMsg("bad","확정취소 실패: " + e.message);
        }
      }
    }

    async function saveUpdate(){
      try{
        setMsg("", "");
        if(!SELECTED_ID){
          setMsg("bad","수정할 예약을 왼쪽 목록에서 선택해줘.");
          return;
        }

        const res_date = $("e_date").value;
        const res_time = getNormalizedTimeHHMM("e_time_raw");
        const branch = getEditorBranchValue();


        const guests_count = Number($("e_guests").value);
        const priceRaw = $("e_price").value;
        const price = priceRaw === "" ? null : Number(priceRaw);

        const menu_ko = ($("e_menu_ko").value || "").trim();
        const menu_vi = ($("e_menu_vi").value || "").trim();
        const note = ($("e_note").value || "").trim();
        const guide_name = ($("e_guide").value || "").trim();

        if(!res_date || !res_time){
          setMsg("bad","DATE / TIME은 필수야");
          return;
        }
        if(!branch){
          setMsg("bad","BRANCH는 필수야");
          return;
        }
        if(!Number.isFinite(guests_count) || guests_count <= 0){
          setMsg("bad","GUESTS를 숫자로 입력해줘 (예: 13)");
          return;
        }
        if(price !== null && (!Number.isFinite(price) || price < 0)){
          setMsg("bad","PRICE는 0 이상의 숫자만 가능");
          return;
        }

        if(menu_ko && !menu_vi){
          const mapped = KO_VI_MENU_MAP[normalizeKey(menu_ko)];
          if(mapped) $("e_menu_vi").value = mapped;
        }

        const body = {
          pw: ADMIN_PW,
          p_id: SELECTED_ID,
          p_res_date: res_date,
          p_res_time: res_time,
          p_guests_count: guests_count,
          p_price: price,
          p_menu_ko: menu_ko,
          p_menu_vi: ($("e_menu_vi").value || "").trim(),
          p_note: note,
          p_branch: branch,
          p_guide_name: guide_name
        };

        await rpc("admin_update_resv_group", body);
        setMsg("ok","저장 완료!");
        await loadList({ preserveSelected:true });
      }catch(e){
        if((e.message || "").toLowerCase().includes("forbidden")){
          sessionStorage.removeItem(ADMIN_PASS_KEY);
          ADMIN_PW = "";
          setMsg("bad","비밀번호가 틀렸거나 권한이 없습니다. 다시 입력해줘.");
          const ok = await requireAdminPassword();
          if(ok) setMsg("bad","다시 저장 버튼을 눌러줘.");
        }else{
          setMsg("bad","저장 실패: " + e.message);
        }
      }
    }

    async function deleteSelected(){
      try{
        setMsg("", "");
        if(!SELECTED_ID){
          setMsg("bad","삭제할 예약을 왼쪽 목록에서 선택해줘.");
          return;
        }

        const ok = confirm("정말 삭제할까요? (되돌릴 수 없습니다)");
        if(!ok) return;

        const url = `${SUPABASE_URL}/rest/v1/resv_groups?id=eq.${encodeURIComponent(SELECTED_ID)}`;

        const res = await fetch(url, {
          method: "DELETE",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          }
        });

        const text = await res.text();
        if(!res.ok){
          let json=null; try{ json = text ? JSON.parse(text) : null; }catch{}
          const err = (json && (json.message || json.error)) || text || ("HTTP " + res.status);
          throw new Error(err);
        }

        setMsg("ok","삭제 완료!");
        await loadList();
        clearSelection();
      }catch(e){
        if((e.message || "").toLowerCase().includes("forbidden")){
          setMsg("bad","권한이 없습니다(삭제 불가). RLS/정책 또는 비밀번호 RPC가 필요해.");
        }else{
          setMsg("bad","삭제 실패: " + e.message);
        }
      }
    }

    function buildBranch(){
      const sel = $("q_branch");
      BRANCH_PRESETS.forEach(b=>{
        const o=document.createElement("option");
        o.value=b; o.textContent=b;
        sel.appendChild(o);
      });
    }
    function buildEditorBranchSelect(){
  const sel = $("e_branch_select");
  if(!sel) return;

  sel.innerHTML = "";

  const custom = document.createElement("option");
  custom.value = "__custom__";
  custom.textContent = "✍️ 직접입력 (커스텀)";
  sel.appendChild(custom);

  for(const b of BRANCH_PRESETS){
    const opt = document.createElement("option");
    opt.value = b;
    opt.textContent = b;
    sel.appendChild(opt);
  }

  sel.value = "ANT"; // 기본값(원하는 값으로 변경 가능)
  applyEditorBranchMode();
}

function applyEditorBranchMode(){
  const val = $("e_branch_select").value;
  const box = $("e_branch_custom_box");
  if(val === "__custom__"){
    box.style.display = "block";
    setTimeout(()=> $("e_branch_custom").focus(), 0);
  }else{
    box.style.display = "none";
    $("e_branch_custom").value = "";
  }
}

$("e_branch_select").addEventListener("change", applyEditorBranchMode);

function getEditorBranchValue(){
  const val = $("e_branch_select").value;
  if(val === "__custom__"){
    return ($("e_branch_custom").value || "").trim();
  }
  return val;
}

// 선택된 row의 branch를 editor에 반영 (프리셋에 없으면 커스텀으로)
function setEditorBranchFromValue(branch){
  const b = (branch || "").trim();
  if(!b){
    $("e_branch_select").value = "ANT";
    $("e_branch_custom").value = "";
    applyEditorBranchMode();
    return;
  }

  if(BRANCH_PRESETS.includes(b)){
    $("e_branch_select").value = b;
    $("e_branch_custom").value = "";
    applyEditorBranchMode();
  }else{
    $("e_branch_select").value = "__custom__";
    $("e_branch_custom").value = b;
    applyEditorBranchMode();
  }
}

    // editor time preview
    $("e_time_raw").addEventListener("input", () => updateTimePreview("e_time_raw","e_time_preview"));
    $("e_time_raw").addEventListener("blur", () => {
      const t = getNormalizedTimeHHMM("e_time_raw");
      if(t){
        $("e_time_raw").value = t;
        updateTimePreview("e_time_raw","e_time_preview");
      }
    });

    $("btnDelete").addEventListener("click", deleteSelected);

    // KO 입력 시 VI 자동
    $("e_menu_ko").addEventListener("input", () => {
      const key = normalizeKey($("e_menu_ko").value);
      const mapped = KO_VI_MENU_MAP[key];
      if(mapped){
        $("e_menu_vi").value = mapped;
      }
    });

    // buttons
    $("btnToday").addEventListener("click", async () => { setMode("today"); await loadList(); });
    $("btnFromToday").addEventListener("click", async () => { setMode("fromToday"); await loadList(); });
    $("btnRange").addEventListener("click", async () => {
      setMode("range");
      if(!$("q_from").value || !$("q_to").value) setDefaultRange();
      await loadList();
    });
    $("btnApplyRange").addEventListener("click", loadList);

    $("btnRefresh").addEventListener("click", loadList);
    $("q_branch").addEventListener("change", loadList);
    $("btnClear").addEventListener("click", clearSelection);
    $("btnSave").addEventListener("click", saveUpdate);
    $("btnConfirm").addEventListener("click", confirmToOrders);
    $("btnUnconfirm").addEventListener("click", unconfirmReservation);

    // ✅ init
    (async function init(){
      const ok = await requireAdminPassword();
      if(!ok) return;

      buildBranch();
      buildEditorBranchSelect();

      setMode("fromToday");
      setDefaultRange();
      $("btnUnconfirm").disabled = true;
      $("btnUnconfirm").style.opacity = ".45";
      loadList();
    })();
  </script>
