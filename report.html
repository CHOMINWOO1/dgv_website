<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Monthly Settlement</title>
  <style>
    :root{
      --bg:#faf6ee; --card:#fffdf7; --ink:#3a2a1f; --sub:#6b5444;
      --line:#e7d7b8; --gold:#caa24c; --shadow:0 10px 24px rgba(0,0,0,.10);
      --radius:16px; --ok:#1b7f3a; --bad:#b42318;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{max-width:1200px;margin:18px auto;padding:0 12px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
    h1{margin:0;font-size:18px}
    .sub{margin:4px 0 0;color:var(--sub);font-size:12px}

    .controls{
      margin-top:12px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
    }
    label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px}
    select,input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      outline:none;
    }
    button{
      border:0; cursor:pointer; border-radius:12px; padding:10px 12px;
      font-weight:900; letter-spacing:.02em;
    }
    .btn-primary{background:var(--gold);color:#2b1e14}
    .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}

    .grid{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:12px;
      margin-top:12px;
    }

    .panel{
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }
    .panel-head{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background:#fff7e8;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-weight:900;
      color:var(--sub);
      font-size:12px;
    }
    .rows{max-height:70vh; overflow:auto}
    .row{
      padding:10px 12px;
      border-bottom:1px solid #f1e6cf;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .title{font-weight:1000}
    .muted{color:var(--sub);font-size:12px}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 8px;border:1px solid var(--line);border-radius:999px;
      background:#fff;font-size:12px;font-weight:900;color:var(--sub);
      white-space:nowrap;
    }
    .note-mini{
      margin-top:6px;
      color:var(--sub);
      font-size:12px;
      white-space:pre-wrap;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .summary{ padding:12px; }
    .sum-box{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:#fff;
    }
    .table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:12px;
    }
    .table th,.table td{
      padding:10px 10px;
      border-bottom:1px solid #f1e6cf;
      text-align:center;
      font-size:13px;
    }
    .table th{
      background:#fff7e8;
      color:var(--sub);
      font-weight:1000;
    }
    .table tr:last-child td{border-bottom:0}
    .right{text-align:right}
    .msg{margin-top:10px;font-size:14px}
    .ok{color:var(--ok);font-weight:900}
    .bad{color:var(--bad);font-weight:900}

    /* ✅ Print 전용 요약표(숨김 상태) */
    #printArea{ display:none; padding:10px 12px; }
    .p-table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }
    .p-table th, .p-table td{
  border-bottom:1px solid #eee2c6;
  padding:4px 6px;
  font-size:10.5px;
  line-height:1.15;
  vertical-align:top;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

    .p-table thead th{
      font-weight:900;
      color:var(--sub);
      background:#fff7e8;
    }
.p-table .col-date{width:74px}
.p-table .col-time{width:44px}

/* ✅ 가이드 더 길게 */
.p-table .col-guide{width:110px}

/* 인원은 좁게 */
.p-table .col-guests{width:46px; text-align:right}

/* ✅ 메뉴는 짧게: 폭을 제한 */
.p-table .col-menu{width:220px}
    .p-meta{
      font-size:11px;
      color:var(--sub);
      margin:0 0 6px;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .p-meta b{color:var(--ink)}

    @media (max-width:980px){
      .grid{grid-template-columns:1fr}
      .rows{max-height:45vh}
    }

    /***********************
     * ✅ PRINT ONLY
     * - 예약목록: "요약표(한줄)"로 출력
     * - Discount summary: 그대로
     ***********************/
    @media print{
      @page { size: A4; margin: 10mm; }

      body{ background:#fff !important; }
      .wrap{ max-width:none; margin:0; padding:0; }
      .card, .panel{ box-shadow:none !important; }
      .card{ border:0 !important; padding:0 !important; }

      .controls{ display:none !important; }

      /* 2컬럼 -> 1컬럼 */
      .grid{ display:block !important; }

      /* ✅ 화면용 리스트는 숨기고, printArea(요약표)만 보이게 */
      .rows{ display:none !important; }
      #printArea{ display:block !important; }

      /* 공간 줄이기 */
      h1{ font-size:14px !important; }
      .sub{ font-size:10px !important; }
      .panel-head{ padding:6px 10px !important; font-size:11px !important; }
      .summary{ padding:8px !important; }
      .sum-box{ padding:10px !important; }

      /* 페이지 중간 찢김 방지 */
      .panel{ break-inside:avoid; page-break-inside:avoid; margin-bottom:10px; }
      #printArea, .sum-box{ break-inside:avoid; page-break-inside:avoid; }

      /* 프린터 배경색 유지 */
      .panel-head, .p-table thead th, .table th{
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1>월간정산</h1>
          
        </div>
      </div>

      <div class="controls">
        <div style="min-width:220px">
          <label>BRANCH</label>
          <select id="branch">
            <option value="">선택</option>
          </select>
        </div>

        <div style="min-width:180px">
          <label>MONTH (YYYY-MM)</label>
          <input id="month" type="month" />
        </div>

        <button class="btn-primary" id="btnRun" type="button">정산 불러오기</button>
        <button class="btn-ghost" id="btnTodayMonth" type="button">이번달</button>
        <button class="btn-ghost" id="btnPrint" type="button">PRINT</button>
      </div>

      <div class="grid">
        <!-- LIST -->
        <div class="panel">
          <div class="panel-head">
            <span id="listTitle">예약 목록</span>
            <span id="listCount">0건</span>
          </div>

          <!-- ✅ PRINT 전용 요약표 영역 -->
          <div id="printArea">
            <div class="p-meta">
              <div><b id="pTitle">-</b></div>
              <div><span id="pCount">0</span>건</div>
            </div>

            <table class="p-table">
              <thead>
                <tr>
                  <th class="col-date">DATE</th>
                  <th class="col-time">TIME</th>
                  <th class="col-guide">GUIDE</th>
                  <th class="col-guests">GUESTS</th>
                  <th class="col-menu">MENU</th>
                </tr>
              </thead>
              <tbody id="pRows">
                <tr><td colspan="5" style="color:#6b5444;">데이터 없음</td></tr>
              </tbody>
            </table>
          </div>

          <!-- ✅ 화면용 기존 카드 리스트 -->
          <div class="rows" id="rows"></div>
        </div>

        <!-- SUMMARY -->
        <div class="panel">
          <div class="panel-head">
            <span>DISCOUNT SUMMARY</span>
            <span class="muted" id="sumHint">PRICE 기준</span>
          </div>

          <div class="summary">
            <div class="sum-box">
              <div class="muted" style="margin-bottom:8px">
                기준: <b>PRICE &lt; 200,000 → 10,000</b> / <b>PRICE ≥ 200,000 → 20,000</b>
              </div>

              <table class="table">
                <thead>
                  <tr>
                    <th>DISCOUNT</th>
                    <th>GUESTS</th>
                    <th class="right">TOTAL (VND)</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>10,000</td>
                    <td id="g10">0</td>
                    <td class="right" id="t10">0</td>
                  </tr>
                  <tr>
                    <td>20,000</td>
                    <td id="g20">0</td>
                    <td class="right" id="t20">0</td>
                  </tr>
                  <tr>
                    <td><b>TOTAL</b></td>
                    <td id="gAll"><b>0</b></td>
                    <td class="right" id="tAll"><b>0</b></td>
                  </tr>
                </tbody>
              </table>

              <div class="msg" id="msg"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /***********************
     * ✅ 너 프로젝트
     ***********************/
    const SUPABASE_URL = "https://qzuynzreamdkpmakvefm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_cr1uTfwC5-yOXoV8Ice1_w_3Eqg1cZ_";

    const BRANCH_PRESETS = ["KT","ANT","AST","엠투어","기쁨","JM","TOT","투어패밀리","빅트래블","실크로드","HANA","OTHER"];

    const PRICE_THRESHOLD = 200000;
    const DISCOUNT10 = 10000;
    const DISCOUNT20 = 20000;

    const $ = (id) => document.getElementById(id);

    // ✅ 마지막 불러온 데이터(프린트 요약표 만들 때 사용)
    let LAST_LIST = [];
    let LAST_BRANCH = "";
    let LAST_YYYYMM = "";

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function setMsg(type, text){
      const el = $("msg");
      if(!text){ el.innerHTML = ""; return; }
      el.innerHTML = `<span class="${type}">${escapeHtml(text)}</span>`;
    }

    function fmtVND(n){
      const x = Number(n || 0);
      return x.toLocaleString("en-US");
    }

    async function fetchJson(url){
      const res = await fetch(url, {
        headers:{
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY
        }
      });
      const text = await res.text();
      let json=null; try{ json = text ? JSON.parse(text) : null; }catch{}
      if(!res.ok){
        const err = (json && (json.message || json.error)) || text || ("HTTP " + res.status);
        throw new Error(err);
      }
      return json;
    }

    function buildBranch(){
      const sel = $("branch");
      BRANCH_PRESETS.forEach(b=>{
        const o=document.createElement("option");
        o.value=b; o.textContent=b;
        sel.appendChild(o);
      });
    }

    function setThisMonth(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      $("month").value = `${yyyy}-${mm}`;
    }

    function monthRange(yyyyMM){
  const [y, m] = yyyyMM.split("-").map(Number);
  const mm = String(m).padStart(2,"0");

  // 다음달 계산(연도 넘어감 처리)
  const nextY = (m === 12) ? (y + 1) : y;
  const nextM = (m === 12) ? 1 : (m + 1);
  const nextMM = String(nextM).padStart(2,"0");

  return {
    start: `${y}-${mm}-01`,
    end: `${nextY}-${nextMM}-01`,
  };
}

    function calcDiscount(rows){
      let g10 = 0, g20 = 0;

      for(const r of rows){
        const guests = Number(r.guests_count || 0);
        const price = (r.price === null || r.price === undefined) ? 0 : Number(r.price);
        if(price >= PRICE_THRESHOLD) g20 += guests;
        else g10 += guests;
      }

      const t10 = g10 * DISCOUNT10;
      const t20 = g20 * DISCOUNT20;
      const gAll = g10 + g20;
      const tAll = t10 + t20;

      $("g10").textContent = g10.toLocaleString("en-US");
      $("g20").textContent = g20.toLocaleString("en-US");
      $("gAll").textContent = gAll.toLocaleString("en-US");

      $("t10").textContent = fmtVND(t10);
      $("t20").textContent = fmtVND(t20);
      $("tAll").textContent = fmtVND(tAll);
    }

    function renderList(rows, branch, yyyyMM){
      $("listCount").textContent = `${rows.length}건`;
      $("listTitle").textContent = `${branch} · ${yyyyMM} 예약`;

      const box = $("rows");
      if(!rows.length){
        box.innerHTML = `<div class="muted" style="padding:12px;">데이터 없음</div>`;
        return;
      }

      box.innerHTML = rows.map(r=>{
        const note = (r.note || "").trim();
        const time = (r.res_time || "").slice(0,5);
        const price = (r.price===null || r.price===undefined || r.price==="") ? "" : `${fmtVND(r.price)} VND`;
        const guide = r.guide_name || "";
        const menuKo = r.menu_ko || "";
        const menuVi = r.menu_vi || "";

        return `
          <div class="row">
            <div>
              <div class="title">${escapeHtml(r.res_date)} ${escapeHtml(time)}</div>
              <div class="muted" style="margin-top:4px">
                <span class="pill">${escapeHtml(r.branch || "")}</span>
                <span class="pill">👥 ${escapeHtml(String(r.guests_count ?? ""))}</span>
                ${price ? `<span class="pill">${escapeHtml(price)}</span>` : ``}
              </div>
              ${guide ? `<div class="muted" style="margin-top:6px">GUIDE: ${escapeHtml(guide)}</div>` : ``}
              ${note ? `<div class="note-mini">${escapeHtml(note)}</div>` : ``}
            </div>
            <div style="text-align:right">
              <div class="muted">${escapeHtml(menuKo)}</div>
              <div class="muted">${escapeHtml(menuVi)}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    // ✅ PRINT용: 한 줄 요약표 렌더
    function renderPrintTable(rows, branch, yyyyMM){
      $("pTitle").textContent = `${branch} · ${yyyyMM}`;
      $("pCount").textContent = String(rows.length);

      const tbody = $("pRows");
      if(!rows.length){
        tbody.innerHTML = `<tr><td colspan="5" style="color:#6b5444;">데이터 없음</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(r=>{
        const date = (r.res_date || "");
        const time = (r.res_time || "").slice(0,5);
        const guide = (r.guide_name || "-");
        const guests = String(r.guests_count ?? "");
        const menu = ((r.menu_ko || "") + (r.menu_vi ? ` / ${r.menu_vi}` : "")).trim() || "-";

        return `
          <tr>
            <td class="col-date" title="${escapeHtml(date)}">${escapeHtml(date)}</td>
            <td class="col-time" title="${escapeHtml(time)}">${escapeHtml(time)}</td>
            <td class="col-guide" title="${escapeHtml(guide)}">${escapeHtml(guide)}</td>
            <td class="col-guests" title="${escapeHtml(guests)}">${escapeHtml(guests)}</td>
            <td class="col-menu" title="${escapeHtml(menu)}">${escapeHtml(menu)}</td>
          </tr>
        `;
      }).join("");
    }

    async function run(){
      try{
        setMsg("", "");

        const branch = $("branch").value;
        const yyyyMM = $("month").value;

        if(!branch){ setMsg("bad","BRANCH를 선택해줘"); return; }
        if(!yyyyMM){ setMsg("bad","MONTH(YYYY-MM)을 선택해줘"); return; }

        const {start, end} = monthRange(yyyyMM);

        let url =
          `${SUPABASE_URL}/rest/v1/resv_groups` +
          `?select=id,res_date,res_time,guests_count,price,menu_ko,menu_vi,note,branch,guide_name` +
          `&branch=eq.${encodeURIComponent(branch)}` +
          `&res_date=gte.${start}` +
          `&res_date=lt.${end}` +
          `&order=res_date.asc,res_time.asc`;

        const rows = await fetchJson(url);
        const list = Array.isArray(rows) ? rows : [];

        // ✅ 저장(PRINT에서 사용)
        LAST_LIST = list;
        LAST_BRANCH = branch;
        LAST_YYYYMM = yyyyMM;

        renderList(list, branch, yyyyMM);
        renderPrintTable(list, branch, yyyyMM);
        calcDiscount(list);

        setMsg("ok", `완료: ${branch} / ${yyyyMM}`);
      }catch(e){
        setMsg("bad","실패: " + e.message);
      }
    }

    $("btnRun").addEventListener("click", run);
    $("btnTodayMonth").addEventListener("click", ()=>{ setThisMonth(); });

    // ✅ PRINT 버튼: 인쇄 직전 요약표 한번 더 갱신(혹시 화면만 바뀐 경우 대비)
    $("btnPrint").addEventListener("click", ()=>{
      renderPrintTable(LAST_LIST, LAST_BRANCH || $("branch").value || "-", LAST_YYYYMM || $("month").value || "-");
      window.print();
    });

    // init
    buildBranch();
    setThisMonth();
  </script>
</body>
</html>
