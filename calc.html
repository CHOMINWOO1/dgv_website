<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HANA Menu Calculator</title>
  <style>
    :root{
      --bg:#faf6ee;
      --card:#fffdf7;
      --ink:#3a2a1f;
      --sub:#6b5444;
      --line:#e7d7b8;
      --gold:#caa24c;
      --shadow: 0 10px 24px rgba(0,0,0,.10);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{
      max-width: 1200px;
      margin: 18px auto 60px;
      padding: 0 14px;
    }

    /* ===== (추가) HANA 헤더 ===== */
    .hanaHeader{
      width:100%;
      text-align:center;
      padding: 10px 10px 8px;
      margin: 0 0 14px;
      border-bottom: 1px solid #e4d1bf;
    }
    .hanaHeader .h1{
      margin:0;
      font-size:34px;
      font-weight:900;
      letter-spacing:.28em;
      color:#3f2a1d;
    }
    .hanaHeader .h2{
      margin:6px 0 10px;
      font-size:14px;
      font-weight:700;
      letter-spacing:.26em;
      color:#6a4c3a;
    }
    .hanaHeader .welcome{
      margin:0;
      padding:8px 0 10px;
      border-top:1px solid #e4d1bf;
      color:#3f2a1d;
      font-size:13px;
      line-height:1.4;
    }
    .hanaHeader .welcome span{
      display:block;
      color:#6e5a4a;
      font-size:12px;
    }

    /* ===== 상단 TOTAL + 버튼 ===== */
    .summaryBar{
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }
    @media (max-width: 560px){
      .summaryBar{ grid-template-columns: 1fr; }
      .printWrap{ justify-content:flex-end; }
    }
    .printWrap{
      display:flex;
      flex-direction: column;
      align-items: flex-end;
      gap:10px;
    }
    .printBtnOnly{
      border:1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-weight:900;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
      height: fit-content;
      white-space: nowrap;
    }
    .printBtnOnly:hover{border-color: var(--gold)}

    .resetBtn{
      border:1px solid var(--line);
      background:#fff;
      color: var(--sub);
      font-weight:900;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
      height: fit-content;
      white-space: nowrap;
    }
    .resetBtn:hover{border-color: var(--gold); color: var(--ink);}

    .saveBtn{
      border:1px solid var(--gold);
      background: #fff7e6;
      color: #3a2a1f;
      font-weight:1000;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
      height: fit-content;
      white-space: nowrap;
    }
    .saveBtn:hover{ filter: brightness(0.98); }
    .saveBtn:disabled{ opacity:.55; cursor:not-allowed; }

    /* ✅ (추가) 가이드/팀 입력 박스 */
    .metaBox{
      margin-bottom:10px;
      padding:10px 10px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fffdf7;
      box-shadow: 0 6px 16px rgba(0,0,0,.04);
    }
    .metaTitle{
      font-weight:1000;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--sub);
      font-size:12px;
      margin-bottom:8px;
    }
    .metaGrid{
      display:grid;
      grid-template-columns: 1fr 160px;
      gap:10px;
    }
    @media (max-width: 560px){
      .metaGrid{ grid-template-columns: 1fr; }
    }
    .metaField label{
      display:block;
      font-size:12px;
      font-weight:1000;
      color:var(--sub);
      margin:0 0 6px;
    }
    .metaField input{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 10px;
      font-weight:900;
      background:#fff;
      color:var(--ink);
      outline:none;
    }
    .metaField input:focus{
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(202,162,76,.18);
    }
    .metaHint{
      margin-top:8px;
      font-size:12px;
      color:var(--sub);
      font-weight:900;
    }

    /* ===== 섹션/카드 ===== */
    .section{ margin-top: 12px; }
    .section h2{
      margin: 12px 4px 10px;
      font-size: 16px;
      letter-spacing:.08em;
      text-transform: uppercase;
      color: var(--sub);
      font-weight: 900;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 920px){ .grid{grid-template-columns: repeat(2, minmax(0,1fr));} }
    @media (max-width: 560px){ .grid{grid-template-columns: 1fr;} }

    .card{
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 12px 10px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(202,162,76,.10), rgba(255,255,255,0) 60%);
      pointer-events:none;
    }

    .name{
      font-weight: 1000;
      text-align:center;
      font-size: 18px;
      letter-spacing:.03em;
      margin: 2px 0 4px;
      position:relative;
    }
    .name small{
      display:block;
      margin-top:6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing:.02em;
      color: var(--sub);
    }

    .priceBox{
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: #f7eedc;
      position:relative;
    }
    .priceLine{
      display:flex; justify-content:center; align-items:baseline;
      gap:10px; flex-wrap:wrap;
    }
    .usd{
      font-size: 30px;
      font-weight: 1000;
      letter-spacing:.02em;
    }
    .vnd{
      font-size: 16px;
      font-weight: 900;
      color: var(--sub);
    }
    .qtyRow{
      display:flex; gap:10px; align-items:center; justify-content:center;
      margin-top: 10px;
      position:relative;
    }
    .step{
      width: 38px; height: 38px;
      border-radius: 12px;
      border:1px solid var(--line);
      background:#fff;
      font-size: 18px;
      font-weight: 1000;
      cursor:pointer;
    }
    .qty{
      width: 78px;
      text-align:center;
      padding: 9px 10px;
      border-radius: 12px;
      border:1px solid var(--line);
      font-weight: 1000;
      font-size: 16px;
      background:#fff;
    }
    .lineTotal{
      margin-top: 10px;
      text-align:center;
      font-weight: 900;
      color: var(--sub);
      font-size: 13px;
      position:relative;
    }
    .tag{
      display:inline-block;
      border:1px solid var(--line);
      background: #fffdf7;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      color: var(--sub);
      margin-left: 6px;
    }

    /* ===== TOTAL 카드 ===== */
    .sumCard{
      background: #fff;
      border:2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .sumTitle{
      font-weight: 1000;
      letter-spacing:.06em;
      text-transform: uppercase;
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .big{
      font-size: 34px;
      font-weight: 1000;
      letter-spacing:.02em;
    }
    .muted{color: var(--sub); font-weight:900}
    .list{
      margin-top: 10px;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      display:flex; flex-direction:column; gap:6px;
      font-size: 14px;
    }
    .row{
      display:flex; justify-content:space-between; gap:10px;
    }
    .row b{font-weight: 1000}

    .print-only{ display:none; }

    @media print {
      html, body{ background:#fff !important; height:auto !important; }

      .section, .grid, .card,
      .wrap > *:not(.summaryBar):not(.hanaHeader){
        display:none !important;
      }

      .printWrap{ display:none !important; }

      .hanaHeader{ display:block !important; margin:0 0 10px !important; }

      .summaryBar{ display:block !important; margin:0 !important; }
      #sumLeft{
        display:block !important;
        box-shadow:none !important;
        border:1px solid #e7d7b8 !important;
        border-radius: 0 !important;
        width:100% !important;
        margin:0 !important;
        padding: 12px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .print-only{
        display:block !important;
        text-align:right !important;
        font-size:12px !important;
        color:#000 !important;
        margin-top: 10px !important;
      }

      @page { margin: 8mm; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- 헤더 -->
    <div class="hanaHeader">
      <div class="h1">H A N A</div>
      <div class="h2">K O R E A N &nbsp; R E S T A U R A N T</div>
      <p class="welcome">
        Welcome to HANA Korean Restaurant!
        <span>Chào mừng bạn đến với Nhà hàng Hàn Quốc HANA!</span>
      </p>
    </div>

    <!-- TOTAL + 버튼 -->
    <div class="summaryBar">
      <div class="sumCard" id="sumLeft">

        <!-- ✅ (추가) 가이드/팀 입력 -->
        <div class="metaBox">
          <div class="metaTitle">Optional Info</div>
          <div class="metaGrid">
            <div class="metaField">
              <label for="guideName">가이드 이름 (선택)</label>
              <input id="guideName" type="text" placeholder="예: 홍길동" autocomplete="off" />
            </div>
            <div class="metaField">
              <label for="teamNo">팀 번호 (선택)</label>
              <input id="teamNo" type="text" placeholder="예: 3" inputmode="numeric" autocomplete="off" />
            </div>
          </div>
        </div>

        <div class="sumTitle">Total</div>
        <div class="big"><span id="totalUsd">0</span>$</div>
        <div class="muted" style="font-size:16px;margin-top:4px;">
          <span id="totalVnd">0</span> VND
        </div>
        <div class="list" id="pickedList"></div>

        <!-- 인쇄 때만 날짜/시간 -->
        <div class="print-only" id="printTime"></div>
      </div>

      <div class="printWrap">
        <button class="printBtnOnly" id="printBtn">&nbsp;&nbsp;인&nbsp;쇄   /   máy in&nbsp;&nbsp;</button>
        <button class="saveBtn" id="saveBtn" type="button">저장하기 / Lưu</button>
        <button class="resetBtn" id="resetBtn" type="button">초기화 / Quay lại</button>
      </div>
    </div>

    <!-- DRINK → SIDE -->
    <div class="section">
      <h2>DRINK MENU</h2>
      <div class="grid" id="drinkGrid"></div>
    </div>

    <div class="section">
      <h2>SIDE MENU</h2>
      <div class="grid" id="sideGrid"></div>
    </div>
  </div>

  <!-- Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  /*************************************************
   * ✅ Supabase 설정 (너가 준 값)
   *************************************************/
  const SUPABASE_URL = "https://qzuynzreamdkpmakvefm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_cr1uTfwC5-yOXoV8Ice1_w_3Eqg1cZ_";

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /*************************************************
   * 상태: DB에서 불러온 메뉴 (A안)
   *************************************************/
  let drinkMenu = [];
  let sideMenu = [];
  let allMenu = [];

  const qty = Object.create(null);

  /*************************************************
   * 유틸
   *************************************************/
  const fmtInt = (n) => (Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const clampNonNegInt = (v) => {
    const x = Number(v);
    if (!Number.isFinite(x)) return 0;
    return Math.max(0, Math.floor(x));
  };

  /*************************************************
   * 카드 렌더
   *************************************************/
  function makeCard(m){
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = m.id;

    card.innerHTML = `
      <div class="name">
        ${m.ko_name}
        <small>${m.vi_name}</small>
      </div>
      <div class="priceBox">
        <div class="priceLine">
          <div class="usd">${m.price_usd}$</div>
          <div class="vnd">${fmtInt(m.price_vnd)} VND</div>
        </div>
        <div class="qtyRow">
          <button class="step" data-act="dec">-</button>
          <input class="qty" data-act="qty" type="number" min="0" step="1" value="0" inputmode="numeric" />
          <button class="step" data-act="inc">+</button>
        </div>
        <div class="lineTotal">
          소계: <b><span data-act="lineUsd">0</span>$</b> · <b><span data-act="lineVnd">0</span> VND</b>
          <span class="tag" data-act="tag" style="display:none;">선택됨</span>
        </div>
      </div>
    `;

    card.addEventListener("click", (e) => {
      const act = e.target?.dataset?.act;
      if (!act) return;
      if (act === "inc") setQty(m.id, (qty[m.id] || 0) + 1);
      if (act === "dec") setQty(m.id, (qty[m.id] || 0) - 1);
    });

    const input = card.querySelector('input[data-act="qty"]');
    input.addEventListener("input", () => setQty(m.id, input.value));

    return card;
  }

  /*************************************************
   * DB에서 메뉴 로드 (A안)
   *************************************************/
  async function loadMenuFromDB(){
    const { data, error } = await sb
      .from("menu_items")
      .select("id,type,ko_name,vi_name,price_usd,price_vnd,is_active,sort_order")
      .eq("is_active", true)
      .order("sort_order", { ascending: true });

    if (error){
      alert("메뉴 로드 실패: " + (error.message || "unknown"));
      return [];
    }
    return data || [];
  }

  function clearGrids(){
    document.getElementById("drinkGrid").innerHTML = "";
    document.getElementById("sideGrid").innerHTML = "";
  }

  function mountMenus(rows){
    clearGrids();

    drinkMenu = rows.filter(r => r.type === "drink");
    sideMenu  = rows.filter(r => r.type === "side");
    allMenu   = [...drinkMenu, ...sideMenu];

    for (const k in qty) delete qty[k];
    allMenu.forEach(m => qty[m.id] = 0);

    const drinkGrid = document.getElementById("drinkGrid");
    const sideGrid  = document.getElementById("sideGrid");

    drinkMenu.forEach(m => drinkGrid.appendChild(makeCard(m)));
    sideMenu.forEach(m => sideGrid.appendChild(makeCard(m)));

    updateAll();
  }

  /*************************************************
   * 로직
   *************************************************/
  function setQty(id, v){
    qty[id] = clampNonNegInt(v);
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card){
      const input = card.querySelector('input[data-act="qty"]');
      if (document.activeElement !== input) input.value = qty[id];
    }
    updateAll();
  }

  function computePickedAndTotals(){
    let totalUsd = 0;
    let totalVnd = 0;
    const picked = [];

    for (const m of allMenu){
      const q = qty[m.id] || 0;
      const lineUsd = (m.price_usd || 0) * q;
      const lineVnd = (m.price_vnd || 0) * q;

      totalUsd += lineUsd;
      totalVnd += lineVnd;

      if (q > 0){
        picked.push({
          id: m.id,
          ko: m.ko_name,
          vi: m.vi_name,
          qty: q,
          unit_usd: m.price_usd || 0,
          unit_vnd: m.price_vnd || 0,
          line_usd: lineUsd,
          line_vnd: lineVnd
        });
      }
    }

    return { picked, totalUsd, totalVnd };
  }

  function updateAll(){
    const { picked, totalUsd, totalVnd } = computePickedAndTotals();

    for (const m of allMenu){
      const q = qty[m.id] || 0;
      const lineUsd = (m.price_usd || 0) * q;
      const lineVnd = (m.price_vnd || 0) * q;

      const card = document.querySelector(`.card[data-id="${m.id}"]`);
      if (card){
        card.querySelector('[data-act="lineUsd"]').textContent = fmtInt(lineUsd);
        card.querySelector('[data-act="lineVnd"]').textContent = fmtInt(lineVnd);
        const tag = card.querySelector('[data-act="tag"]');
        tag.style.display = q > 0 ? "inline-block" : "none";
      }
    }

    document.getElementById("totalUsd").textContent = fmtInt(totalUsd);
    document.getElementById("totalVnd").textContent = fmtInt(totalVnd);

    const list = document.getElementById("pickedList");
    list.innerHTML = "";
    if (picked.length === 0){
      list.innerHTML = `<div class="muted">선택된 메뉴가 없습니다.</div>`;
    } else {
      picked.forEach(p => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div><b>${p.ko}</b><span style="color:#6b5444;font-weight:800;"> / ${p.vi}</span> × ${p.qty}</div>
          <div>${fmtInt(p.line_usd)}$ · ${fmtInt(p.line_vnd)} VND</div>
        `;
        list.appendChild(row);
      });
    }
  }

  function resetAll(){
    for (const k in qty) qty[k] = 0;
    document.querySelectorAll('input[data-act="qty"]').forEach(inp => { inp.value = 0; });
    updateAll();
  }

  /*************************************************
   * 저장하기: orders + order_items
   * ✅ 가이드/팀 번호(선택) 함께 저장
   *************************************************/
  async function saveOrder(){
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;

    try{
      const { picked, totalUsd, totalVnd } = computePickedAndTotals();

      if (picked.length === 0){
        alert("저장할 메뉴가 없습니다.");
        return;
      }

      // ✅ (추가) 입력값 읽기 (미입력 가능)
      const guideName = (document.getElementById("guideName").value || "").trim();
      const teamNo = (document.getElementById("teamNo").value || "").trim();

      // 1) orders 저장 (guide_name / team_no 컬럼이 있어야 저장됨)
      const { data: order, error: orderErr } = await sb
        .from("orders")
        .insert([{
          total_usd: totalUsd,
          total_vnd: totalVnd,
          status: "paid",
          source: "calc_web",
          guide_name: guideName || null,
          team_no: teamNo || null
        }])
        .select("id")
        .single();

      if (orderErr) throw orderErr;

      // 2) order_items 저장
      const orderId = order.id;
      const itemsPayload = picked.map(p => ({
        order_id: orderId,
        menu_item_id: p.id,
        qty: p.qty,
        unit_usd: p.unit_usd,
        unit_vnd: p.unit_vnd,
        line_usd: p.line_usd,
        line_vnd: p.line_vnd
      }));

      const { error: itemsErr } = await sb
        .from("order_items")
        .insert(itemsPayload);

      if (itemsErr) throw itemsErr;

      alert("저장 완료!");
      resetAll();

      // ✅ (추가) 저장 성공 시 가이드/팀도 같이 비우기 (원하면 이 줄 2개 삭제하면 유지됨)
      document.getElementById("guideName").value = "";
      document.getElementById("teamNo").value = "";

    } catch(e){
      console.error(e);
      alert("저장 실패");
    } finally{
      btn.disabled = false;
    }
  }

  /*************************************************
   * 인쇄 시간
   *************************************************/
  function setPrintTime(){
    const now = new Date();
    const date = now.toLocaleDateString("ko-KR", { year:"numeric", month:"2-digit", day:"2-digit" });
    const time = now.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
    const el = document.getElementById("printTime");
    if (el) el.textContent = `Printed: ${date} ${time}`;
  }

  /*************************************************
   * 이벤트
   *************************************************/
  document.getElementById("printBtn").addEventListener("click", () => {
    setPrintTime();
    window.print();
  });
  document.getElementById("resetBtn").addEventListener("click", resetAll);
  document.getElementById("saveBtn").addEventListener("click", saveOrder);
  window.addEventListener("beforeprint", setPrintTime);

  /*************************************************
   * 시작
   *************************************************/
  (async function init(){
    const rows = await loadMenuFromDB();
    if (rows.length > 0){
      mountMenus(rows);
    } else {
      drinkMenu = [];
      sideMenu = [];
      allMenu = [];
      updateAll();
    }
  })();
</script>
</body>
</html>
