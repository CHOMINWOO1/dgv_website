<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HANA Menu Calculator</title>
  <style>
    :root{
      --bg:#faf6ee;
      --card:#fffdf7;
      --ink:#3a2a1f;
      --sub:#6b5444;
      --line:#e7d7b8;
      --gold:#caa24c;
      --shadow: 0 10px 24px rgba(0,0,0,.10);
      --radius:16px;
      --bad:#b42318;
    }
    *{box-sizing:border-box}
    html{ -webkit-text-size-adjust:100%; } /* ✅ iOS Safari text autosize fix */

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{
      max-width: 1200px;
      margin: 18px auto 60px;
      padding: 0 14px;
    }

    .hanaHeader{
      width:100%;
      text-align:center;
      padding: 10px 10px 8px;
      margin: 0 0 14px;
      border-bottom: 1px solid #e4d1bf;
    }
    .hanaHeader .h1{
      margin:0;
      font-size:34px;
      font-weight:900;
      letter-spacing:.28em;
      color:#3f2a1d;
    }
    .hanaHeader .h2{
      margin:6px 0 10px;
      font-size:14px;
      font-weight:700;
      letter-spacing:.26em;
      color:#6a4c3a;
    }
    .hanaHeader .welcome{
      margin:0;
      padding:8px 0 10px;
      border-top:1px solid #e4d1bf;
      color:#3f2a1d;
      font-size:13px;
      line-height:1.4;
    }
    .hanaHeader .welcome span{
      display:block;
      color:#6e5a4a;
      font-size:12px;
    }

    .summaryBar{
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }
    @media (max-width: 560px){
      .summaryBar{ grid-template-columns: 1fr; }
      .printWrap{ justify-content:flex-end; }
    }
    .printWrap{
      display:flex;
      flex-direction: column;
      align-items: flex-end;
      gap:10px;
    }
    .printBtnOnly, .resetBtn, .saveBtn{
      border:1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-weight:900;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
      height: fit-content;
      white-space: nowrap;
    }
    .goBtn{
  border:1px solid var(--line);
  background:#fff;
  color: var(--ink);
  font-weight:1000;
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: 0 6px 16px rgba(0,0,0,.06);
  cursor:pointer;
  height: fit-content;
  white-space: nowrap;
}
.goBtn:hover{ border-color: var(--gold); }
    .printBtnOnly:hover,.resetBtn:hover{border-color: var(--gold)}
    .resetBtn{background:#fff;color:var(--sub)}
    .resetBtn:hover{color:var(--ink)}
    .saveBtn{
      border-color: var(--gold);
      background: #fff7e6;
      color: #3a2a1f;
      font-weight:1000;
    }
    .saveBtn:hover{ filter: brightness(0.98); }
    .saveBtn:disabled{ opacity:.55; cursor:not-allowed; }

    .metaBox{
      margin-bottom:10px;
      padding:10px 10px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fffdf7;
      box-shadow: 0 6px 16px rgba(0,0,0,.04);
    }
    .metaTitle{
      font-weight:1000;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--sub);
      font-size:12px;
      margin-bottom:8px;
    }
    .metaGrid{
      display:grid;
      grid-template-columns: 1fr 1fr minmax(210px, 280px);
      gap:10px;
      align-items:end;
    }
    @media (max-width: 560px){ .metaGrid{ grid-template-columns: 1fr; } }
    .metaField{ min-width:0; }
    .metaField label{
      display:block;
      font-size:12px;
      font-weight:1000;
      color:var(--sub);
      margin:0 0 6px;
    }
    .metaField input{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 10px;
      font-weight:900;
      background:#fff;
      color:var(--ink);
      outline:none;
      font-size:16px;
    }
    .metaField input:focus{
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(202,162,76,.18);
    }

    /* ===== 결제 라디오 iOS Safari FIX ===== */
    .payOptions, .feeOptions{
      display:flex;
      gap: 10px 14px;
      align-items:center;
      flex-wrap: wrap;
      white-space: normal;
    }
    .payOptions label, .feeOptions label{
      display: inline-flex;
      align-items:center;
      gap:8px;
      font-weight:900;
      color:var(--ink);
      margin:0;
      user-select:none;
      cursor:pointer;
      min-width: 86px;
      line-height: 1.2;
      font-size:16px;
      padding: 6px 8px;
      border-radius: 12px;
    }
    .payOptions input[type="radio"], .feeOptions input[type="radio"]{
      width:20px;
      height:20px;
      margin:0;
      flex: 0 0 20px;
      transform:none;
    }
    .feeBox{
      margin-top:8px;
      padding-top:8px;
      border-top:1px dashed var(--line);
      display:none;
    }
    .feeHint{
      font-size:12px;
      font-weight:900;
      color:var(--sub);
      margin:0 0 6px;
      letter-spacing:.03em;
    }

    .section{ margin-top: 12px; }
    .section h2{
      margin: 12px 4px 10px;
      font-size: 16px;
      letter-spacing:.08em;
      text-transform: uppercase;
      color: var(--sub);
      font-weight: 900;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 920px){ .grid{grid-template-columns: repeat(2, minmax(0,1fr));} }
    @media (max-width: 560px){ .grid{grid-template-columns: 1fr;} }

    .card{
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 12px 10px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(202,162,76,.10), rgba(255,255,255,0) 60%);
      pointer-events:none;
    }

    .name{
      font-weight: 1000;
      text-align:center;
      font-size: 18px;
      letter-spacing:.03em;
      margin: 2px 0 4px;
      position:relative;
    }
    .name small{
      display:block;
      margin-top:6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing:.02em;
      color: var(--sub);
    }

    .priceBox{
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: #f7eedc;
      position:relative;
    }
    .priceLine{
      display:flex; justify-content:center; align-items:baseline;
      gap:10px; flex-wrap:wrap;
    }
    .usd{ font-size: 30px; font-weight: 1000; letter-spacing:.02em; }
    .vnd{ font-size: 16px; font-weight: 900; color: var(--sub); }
    .qtyRow{
      display:flex; gap:10px; align-items:center; justify-content:center;
      margin-top: 10px;
      position:relative;
    }
    .step{
      width: 38px; height: 38px;
      border-radius: 12px;
      border:1px solid var(--line);
      background:#fff;
      font-size: 18px;
      font-weight: 1000;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .qty{
      width: 78px;
      text-align:center;
      padding: 9px 10px;
      border-radius: 12px;
      border:1px solid var(--line);
      font-weight: 1000;
      font-size: 16px;
      background:#fff;
    }
    .lineTotal{
      margin-top: 10px;
      text-align:center;
      font-weight: 900;
      color: var(--sub);
      font-size: 13px;
      position:relative;
    }
    .tag{
      display:inline-block;
      border:1px solid var(--line);
      background: #fffdf7;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      color: var(--sub);
      margin-left: 6px;
    }

    .sumCard{
      background: #fff;
      border:2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .sumTitle{
      font-weight: 1000;
      letter-spacing:.06em;
      text-transform: uppercase;
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .big{
      font-size: 34px;
      font-weight: 1000;
      letter-spacing:.02em;
    }
    .muted{color: var(--sub); font-weight:900}
    .list{
      margin-top: 10px;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      display:flex; flex-direction:column; gap:6px;
      font-size: 14px;
    }
    .row{ display:flex; justify-content:space-between; gap:10px; }
    .row b{font-weight: 1000}
    .print-only{ display:none; }

    /* ===== SPECIAL MENU ===== */
    .specialBox{
      border:2px solid var(--line);
      border-radius: var(--radius);
      background: #fffdf7;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .specialHead{
      display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap;
      margin-bottom:10px;
    }
    .specialHead .title{
      font-weight:1000; letter-spacing:.08em; text-transform:uppercase; color:var(--sub);
      font-size:14px;
    }
    .specialForm{
      display:grid;
      grid-template-columns: 1fr 140px 120px 120px auto;
      gap:8px;
      align-items:end;
    }
    @media (max-width: 920px){
      .specialForm{ grid-template-columns: 1fr 1fr; }
    }
    .specialForm label{
      display:block; font-size:12px; font-weight:1000; color:var(--sub); margin:0 0 6px;
    }
    .specialForm input{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 10px;
      font-weight:900;
      background:#fff;
      color:var(--ink);
      outline:none;
      font-size:16px;
    }
    .specialForm input:focus{
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(202,162,76,.18);
    }
    .btnSmall{
      border:1px solid var(--gold);
      background:#fff7e6;
      border-radius:12px;
      padding:10px 12px;
      font-weight:1000;
      cursor:pointer;
      white-space:nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btnSmall:hover{ filter:brightness(.98); }
    .btnSmallDanger{
      border:1px solid #f4c7c3;
      background:#fff1f0;
      color:var(--bad);
      border-radius:12px;
      padding:8px 10px;
      font-weight:1000;
      cursor:pointer;
      white-space:nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .specialList{
      margin-top:10px;
      border-top:1px dashed var(--line);
      padding-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .specialItem{
      display:grid;
      grid-template-columns: 1fr auto;
      gap:10px;
      align-items:center;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:10px;
    }
    .specialItem .left b{font-weight:1000}
    .specialItem .left .sub{color:var(--sub); font-weight:900; font-size:12px; margin-top:4px;}
    .specialItem .right{
      display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
    }
    .specialItem .qtyMini{
      width:70px;
      text-align:center;
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px 8px;
      font-weight:1000;
      background:#fff;
      font-size:16px;
    }

    @media print {
      html, body{ background:#fff !important; height:auto !important; }
      .section, .grid, .card, .specialBox,
      .wrap > *:not(.summaryBar):not(.hanaHeader){
        display:none !important;
      }
      .printWrap{ display:none !important; }
      .hanaHeader{ display:block !important; margin:0 0 10px !important; }
      .summaryBar{ display:block !important; margin:0 !important; }

      /* ✅ 인쇄 시 Optional Info 숨김 */
      .metaBox{ display:none !important; }

      #sumLeft{
        display:block !important;
        box-shadow:none !important;
        border:1px solid #e7d7b8 !important;
        border-radius: 0 !important;
        width:100% !important;
        margin:0 !important;
        padding: 12px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .print-only{
        display:block !important;
        text-align:right !important;
        font-size:12px !important;
        color:#000 !important;
        margin-top: 10px !important;
      }
      @page { margin: 8mm; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hanaHeader">
      <div class="h1">H A N A</div>
      <div class="h2">K O R E A N &nbsp; R E S T A U R A N T</div>
      <p class="welcome">
        Welcome to HANA Korean Restaurant!
        <span>Chào mừng bạn đến với Nhà hàng Hàn Quốc HANA!</span>
      </p>
    </div>

    <div class="summaryBar">
      <div class="sumCard" id="sumLeft">
        <div class="metaBox">
          <div class="metaTitle">Optional Info</div>

          <div class="metaGrid">
            <div class="metaField">
              <div class="metaField">
                <label>주문 날짜 (선택)</label>
                <div class="payOptions" id="dateOptions" style="gap:10px 12px;">
                  <label><input type="radio" name="orderDateMode" value="today" checked> today</label>
                  <label><input type="radio" name="orderDateMode" value="yesterday"> yesterday</label>
                  <label><input type="radio" name="orderDateMode" value="pick"> pick</label>
                </div>

                <div class="feeBox" id="datePickBox" style="display:none;">
                  <div class="feeHint">Pick a date</div>
                  <input id="orderDateInput" type="date" style="width:220px;">
                </div>
              </div>

              <label for="guideName">가이드 이름 (선택)</label>
              <input id="guideName" type="text" placeholder="예: 홍길동" autocomplete="off" />
            </div>

            <div class="metaField">
              <label for="teamNo">팀 정보 (선택)</label>
              <input id="teamNo" type="text" placeholder="예: 1팀 남자 4" autocomplete="off" />
            </div>

            <div class="metaField">
              <label>결제</label>
              <div class="payOptions" id="payOptions">
                <label><input type="radio" name="payMethod" value="cash" checked> cash</label>
                <label><input type="radio" name="payMethod" value="card"> card</label>
                <label><input type="radio" name="payMethod" value="bank"> bank</label>
              </div>

              <!-- ✅ 카드일 때만 보이는 추가 옵션 -->
              <div class="feeBox" id="cardFeeBox">
                <div class="feeHint">Card amount option</div>
                <div class="feeOptions">
                  <label title="기본 카드 결제 (추가 없음)">
                    <input type="radio" name="cardFeeMode" value="none" checked>
                    Standard
                  </label>
                  <label title="카드 수수료(7%) 포함">
                    <input type="radio" name="cardFeeMode" value="fee7">
                    Card total (incl. 7% service fee)
                  </label>
                </div>
              </div>

            </div>
          </div>
        </div>

        <div class="sumTitle" id="modeTitle">Total</div>
        <div class="big"><span id="totalUsd">0</span>$</div>
        <div class="muted" style="font-size:16px;margin-top:4px;">
          <span id="totalVnd">0</span> VND
        </div>
        <div class="muted" id="feeInfo" style="font-size:12px;margin-top:6px;display:none;"></div>

        <div class="list" id="pickedList"></div>
        <div class="print-only" id="printTime"></div>
      </div>

      <div class="printWrap">
        <button class="printBtnOnly" id="printBtn">&nbsp;&nbsp;인&nbsp;쇄   /   máy in&nbsp;&nbsp;</button>
        <button class="saveBtn" id="saveBtn" type="button">저장하기 / Lưu</button>
        <button class="resetBtn" id="resetBtn" type="button">초기화 / Quay lại</button>
        <button class="goBtn" id="goReservBtn" type="button">예약 확인 / Check</button>
      </div>
    </div>

    <div class="section">
      <h2>DRINK MENU</h2>
      <div class="grid" id="drinkGrid"></div>
    </div>

    <div class="section">
      <h2>SIDE MENU</h2>
      <div class="grid" id="sideGrid"></div>
    </div>

    <div class="section">
      <h2>OTHER MENU</h2>
      <div class="grid" id="otherGrid"></div>
    </div>

    <div class="section">
      <h2>SPECIAL MENU (직접입력)</h2>
      <div class="specialBox">
        <div class="specialHead">
          <div class="title">Special Lines (Add many)</div>
          <div class="muted" style="font-size:12px;">손님 요청으로 임시 메뉴를 여러 개 추가 가능</div>
        </div>

        <div class="specialForm">
          <div>
            <label>메뉴명 (KO)</label>
            <input id="spKo" type="text" placeholder="예: 특별 볶음밥" autocomplete="off">
          </div>
          <div>
            <label>메뉴명 (VI, 선택)</label>
            <input id="spVi" type="text" placeholder="Tuỳ chọn" autocomplete="off">
          </div>
          <div>
            <label>가격 (VND)</label>
            <input id="spVnd" type="number" min="0" step="1000" inputmode="numeric" placeholder="예: 120000">
          </div>
          <div>
            <label>가격 (USD, 선택)</label>
            <input id="spUsd" type="number" min="0" step="1" inputmode="numeric" placeholder="예: 5">
          </div>
          <div>
            <label>수량</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input id="spQty" type="number" min="1" step="1" value="1" class="qtyMini" style="width:90px;">
              <button class="btnSmall" id="spAddBtn" type="button">추가</button>
            </div>
          </div>
        </div>

        <div class="specialList" id="specialList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  /*************************************************
   * ✅ Supabase 설정
   *************************************************/
  const SUPABASE_URL = "https://qzuynzreamdkpmakvefm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_cr1uTfwC5-yOXoV8Ice1_w_3Eqg1cZ_";
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let drinkMenu = [];
  let sideMenu = [];
  let otherMenu = [];
  let allMenu = [];

  const qty = Object.create(null);

  // SPECIAL lines (custom)
  const specialLines = [];
  // { id, ko, vi, qty, unit_vnd, unit_usd }

  // edit mode
  const params = new URLSearchParams(location.search);
  const editOrderId = params.get("edit");
  const isEditMode = !!editOrderId;

  const fmtInt = (n) => (Math.round(Number(n) || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const clampNonNegInt = (v) => {
    const x = Number(v);
    if (!Number.isFinite(x)) return 0;
    return Math.max(0, Math.floor(x));
  };

  function uid(){
    return Math.random().toString(16).slice(2) + Date.now().toString(16);
  }

  function makeCard(m){
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = m.id;

    card.innerHTML = `
      <div class="name">
        ${m.ko_name || "-"}
        <small>${m.vi_name || ""}</small>
      </div>
      <div class="priceBox">
        <div class="priceLine">
          <div class="usd">${Number(m.price_usd || 0)}$</div>
          <div class="vnd">${fmtInt(m.price_vnd || 0)} VND</div>
        </div>
        <div class="qtyRow">
          <button class="step" data-act="dec">-</button>
          <input class="qty" data-act="qty" type="number" min="0" step="1" value="0" inputmode="numeric" />
          <button class="step" data-act="inc">+</button>
        </div>
        <div class="lineTotal">
          소계: <b><span data-act="lineUsd">0</span>$</b> · <b><span data-act="lineVnd">0</span> VND</b>
          <span class="tag" data-act="tag" style="display:none;">선택됨</span>
        </div>
      </div>
    `;

    card.addEventListener("click", (e) => {
      const act = e.target?.dataset?.act;
      if (!act) return;
      if (act === "inc") setQty(m.id, (qty[m.id] || 0) + 1);
      if (act === "dec") setQty(m.id, (qty[m.id] || 0) - 1);
    });

    const input = card.querySelector('input[data-act="qty"]');
    input.addEventListener("input", () => setQty(m.id, input.value));

    return card;
  }

  async function loadMenuFromDB(){
    const { data, error } = await sb
      .from("menu_items")
      .select("id,type,ko_name,vi_name,price_usd,price_vnd,is_active,sort_order")
      .eq("is_active", true)
      .order("sort_order", { ascending: true });

    if (error){
      alert("메뉴 로드 실패: " + (error.message || "unknown"));
      return [];
    }
    return data || [];
  }

  function clearGrids(){
    document.getElementById("drinkGrid").innerHTML = "";
    document.getElementById("sideGrid").innerHTML = "";
    document.getElementById("otherGrid").innerHTML = "";
  }

  function mountMenus(rows){
    clearGrids();

    drinkMenu = rows.filter(r => r.type === "drink");
    sideMenu  = rows.filter(r => r.type === "side");
    otherMenu = rows.filter(r => r.type === "other");
    allMenu   = [...drinkMenu, ...sideMenu, ...otherMenu];

    // qty 초기화
    for (const k in qty) delete qty[k];
    allMenu.forEach(m => qty[m.id] = 0);

    const drinkGrid = document.getElementById("drinkGrid");
    const sideGrid  = document.getElementById("sideGrid");
    const otherGrid = document.getElementById("otherGrid");

    drinkMenu.forEach(m => drinkGrid.appendChild(makeCard(m)));
    sideMenu.forEach(m => sideGrid.appendChild(makeCard(m)));
    otherMenu.forEach(m => otherGrid.appendChild(makeCard(m)));

    updateAll();
  }

  function setQty(id, v){
    qty[id] = clampNonNegInt(v);
    if (qty[id] < 0) qty[id] = 0;

    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card){
      const input = card.querySelector('input[data-act="qty"]');
      if (document.activeElement !== input) input.value = qty[id];
    }
    updateAll();
  }

  // helpers
  function getPaymentMethod(){
    return document.querySelector('input[name="payMethod"]:checked')?.value || "cash";
  }
  function getCardFeeMode(){
    return document.querySelector('input[name="cardFeeMode"]:checked')?.value || "none";
  }
  function toggleCardFeeUI(){
    const pm = getPaymentMethod();
    const box = document.getElementById("cardFeeBox");
    if (!box) return;

    if (pm === "card"){
      box.style.display = "block";
    } else {
      box.style.display = "none";
      // 카드가 아니면 fee 옵션은 기본값으로 복귀
      const noneRadio = document.querySelector('input[name="cardFeeMode"][value="none"]');
      if (noneRadio) noneRadio.checked = true;
    }
  }

  function getOrderDateMode(){
    return document.querySelector('input[name="orderDateMode"]:checked')?.value || "today";
  }
  function toggleDatePickUI(){
    const mode = getOrderDateMode();
    const box = document.getElementById("datePickBox");
    if (!box) return;
    box.style.display = (mode === "pick") ? "block" : "none";
  }
  function getCreatedAtForSave(){
    // returns ISO string (timestamptz)
    const mode = getOrderDateMode();
    const now = new Date();

    if (mode === "today"){
      return now.toISOString();
    }
    if (mode === "yesterday"){
      const d = new Date(now);
      d.setDate(d.getDate() - 1);
      return d.toISOString();
    }

    // pick
    const v = (document.getElementById("orderDateInput")?.value || "").trim();
    if (!v) return now.toISOString();

    // picked date at local 12:00 to avoid timezone shift
    const picked = new Date(`${v}T12:00:00`);
    return picked.toISOString();
  }

  function roundTo1000(n){
    const x = Number(n) || 0;
    return Math.round(x / 1000) * 1000;   // ✅ 1,000 단위 반올림
  }

  function applyCardFeeIfNeeded(baseUsd, baseVnd){
    const pm = getPaymentMethod();
    const mode = getCardFeeMode();

    if (pm === "card" && mode === "fee7"){
      const usd = Math.round((Number(baseUsd) || 0) * 1.07);

      // ✅ VND는 7% 적용 후 1,000 단위 반올림
      const rawVnd = (Number(baseVnd) || 0) * 1.07;
      const vnd = roundTo1000(rawVnd);

      return {
        usd,
        vnd,
        fee_usd: usd - (Number(baseUsd) || 0),
        fee_vnd: vnd - (Number(baseVnd) || 0),
        applied: true
      };
    }

    return {
      usd: Math.round(Number(baseUsd) || 0),
      vnd: Math.round(Number(baseVnd) || 0),
      fee_usd: 0,
      fee_vnd: 0,
      applied: false
    };
  }

  function computePickedAndTotals(){
    let totalUsd = 0;
    let totalVnd = 0;
    const picked = [];

    // normal menu items
    for (const m of allMenu){
      const q = qty[m.id] || 0;
      const unitUsd = Number(m.price_usd) || 0;
      const unitVnd = Number(m.price_vnd) || 0;
      const lineUsd = unitUsd * q;
      const lineVnd = unitVnd * q;

      totalUsd += lineUsd;
      totalVnd += lineVnd;

      if (q > 0){
        picked.push({
          kind: "menu",
          id: m.id,
          ko: m.ko_name,
          vi: m.vi_name,
          qty: q,
          unit_usd: unitUsd,
          unit_vnd: unitVnd,
          line_usd: lineUsd,
          line_vnd: lineVnd
        });
      }
    }

    // special custom lines
    for (const s of specialLines){
      const q = Number(s.qty || 0);
      const unitUsd = Number(s.unit_usd || 0);
      const unitVnd = Number(s.unit_vnd || 0);
      const lineUsd = unitUsd * q;
      const lineVnd = unitVnd * q;

      totalUsd += lineUsd;
      totalVnd += lineVnd;

      if (q > 0){
        picked.push({
          kind: "special",
          id: s.id,
          ko: s.ko,
          vi: s.vi,
          qty: q,
          unit_usd: unitUsd,
          unit_vnd: unitVnd,
          line_usd: lineUsd,
          line_vnd: lineVnd
        });
      }
    }

    return { picked, totalUsd, totalVnd };
  }

  function updateAll(){
    toggleCardFeeUI();

    const { picked, totalUsd: baseUsd, totalVnd: baseVnd } = computePickedAndTotals();
    const adj = applyCardFeeIfNeeded(baseUsd, baseVnd);

    // update menu cards line totals
    for (const m of allMenu){
      const q = qty[m.id] || 0;
      const lineUsd = (Number(m.price_usd) || 0) * q;
      const lineVnd = (Number(m.price_vnd) || 0) * q;
      const card = document.querySelector(`.card[data-id="${m.id}"]`);

      if (card){
        card.querySelector('[data-act="lineUsd"]').textContent = fmtInt(lineUsd);
        card.querySelector('[data-act="lineVnd"]').textContent = fmtInt(lineVnd);
        const tag = card.querySelector('[data-act="tag"]');
        tag.style.display = q > 0 ? "inline-block" : "none";
      }
    }

    // ✅ 화면 총액은 (카드+7% 선택 시) 적용된 값
    document.getElementById("totalUsd").textContent = fmtInt(adj.usd);
    document.getElementById("totalVnd").textContent = fmtInt(adj.vnd);

    const feeInfo = document.getElementById("feeInfo");
    if (feeInfo){
      if (adj.applied){
        feeInfo.style.display = "block";
        feeInfo.textContent = `Tax service 7%`;
      } else {
        feeInfo.style.display = "none";
        feeInfo.textContent = "";
      }
    }

    // picked list
    const list = document.getElementById("pickedList");
    list.innerHTML = "";

    if (picked.length === 0) {
      list.innerHTML = `<div class="muted">선택된 메뉴가 없습니다.</div>`;
    } else {
      picked.forEach(p => {
        const row = document.createElement("div");
        row.className = "row";

        const tag = (p.kind === "special")
          ? `<span class="tag">SPECIAL</span>`
          : "";

        row.innerHTML = `
          <div>
            <b>${p.ko || "-"}</b>
            <span style="color:#6b5444;font-weight:800;"> / ${p.vi || ""}</span>
            × ${p.qty}
            ${tag}
          </div>
          <div>${fmtInt(p.line_usd)}$ · ${fmtInt(p.line_vnd)} VND</div>
        `;

        list.appendChild(row);
      });
    }

    renderSpecialList();
  }

  function resetAll(){
    const todayRadio = document.querySelector('input[name="orderDateMode"][value="today"]');
    if (todayRadio) todayRadio.checked = true;
    const di = document.getElementById("orderDateInput");
    if (di) di.value = "";
    toggleDatePickUI();

    // 1) 수량 초기화
    for (const k in qty) qty[k] = 0;
    document.querySelectorAll('input[data-act="qty"]').forEach(inp => { inp.value = 0; });

    // 2) SPECIAL 초기화
    specialLines.length = 0;
    clearSpecialDraft();

    // 3) Optional Info 초기화
    document.getElementById("guideName").value = "";
    document.getElementById("teamNo").value = "";
    const cashRadio = document.querySelector('input[name="payMethod"][value="cash"]');
    if (cashRadio) cashRadio.checked = true;

    // 카드 fee 기본으로
    const noneRadio = document.querySelector('input[name="cardFeeMode"][value="none"]');
    if (noneRadio) noneRadio.checked = true;

    updateAll();
  }

  // SPECIAL UI
  function clearSpecialDraft(){
    document.getElementById("spKo").value = "";
    document.getElementById("spVi").value = "";
    document.getElementById("spVnd").value = "";
    document.getElementById("spUsd").value = "";
    document.getElementById("spQty").value = "1";
  }

  function addSpecialLine(){
    const ko = (document.getElementById("spKo").value || "").trim();
    const vi = (document.getElementById("spVi").value || "").trim();
    const vnd = clampNonNegInt(document.getElementById("spVnd").value);
    const usd = clampNonNegInt(document.getElementById("spUsd").value);
    const q = Math.max(1, clampNonNegInt(document.getElementById("spQty").value));

    if (!ko){
      alert("SPECIAL 메뉴명(KO)을 입력하세요.");
      return;
    }
    if (vnd <= 0 && usd <= 0){
      alert("가격(VND 또는 USD)을 입력하세요.");
      return;
    }

    specialLines.push({
      id: uid(),
      ko,
      vi: vi || "",
      qty: q,
      unit_vnd: vnd,
      unit_usd: usd
    });
    clearSpecialDraft();
    updateAll();
  }

  function renderSpecialList(){
    const box = document.getElementById("specialList");
    box.innerHTML = "";

    if (specialLines.length === 0){
      box.innerHTML = `<div class="muted">추가된 SPECIAL 메뉴가 없습니다.</div>`;
      return;
    }

    specialLines.forEach((s, idx) => {
      const lineVnd = (Number(s.unit_vnd||0) * Number(s.qty||0));
      const lineUsd = (Number(s.unit_usd||0) * Number(s.qty||0));

      const div = document.createElement("div");
      div.className = "specialItem";
      div.innerHTML = `
        <div class="left">
          <b>${s.ko}</b> <span class="tag">SPECIAL</span>
          <div class="sub">${s.vi || ""}</div>
          <div class="sub">Unit: ${fmtInt(s.unit_vnd)} VND · ${fmtInt(s.unit_usd)}$</div>
          <div class="sub">Line: ${fmtInt(lineVnd)} VND · ${fmtInt(lineUsd)}$</div>
        </div>
        <div class="right">
          <button class="step" data-act="dec">-</button>
          <input class="qtyMini" data-act="qty" type="number" min="0" step="1" value="${Number(s.qty||0)}" />
          <button class="step" data-act="inc">+</button>
          <button class="btnSmallDanger" data-act="del">삭제</button>
        </div>
      `;

      div.querySelector('[data-act="inc"]').addEventListener("click", () => {
        s.qty = clampNonNegInt(Number(s.qty||0) + 1);
        updateAll();
      });
      div.querySelector('[data-act="dec"]').addEventListener("click", () => {
        s.qty = clampNonNegInt(Number(s.qty||0) - 1);
        updateAll();
      });
      div.querySelector('input[data-act="qty"]').addEventListener("input", (e) => {
        s.qty = clampNonNegInt(e.target.value);
        updateAll();
      });
      div.querySelector('[data-act="del"]').addEventListener("click", () => {
        specialLines.splice(idx, 1);
        updateAll();
      });

      box.appendChild(div);
    });
  }

  /*************************************************
   * ✅ 저장 보호(저장만 비번, 프린트는 제외)
   *************************************************/
  async function verifyAdminPassword(pass){
    try{
      const { data, error } = await sb.rpc("admin_check_password", { p_password: pass });
      if (error) throw error;
      return data === true;
    }catch(e){
      console.error(e);
      return false;
    }
  }

  async function requireAdminPassword(){
    const key = "hana_admin_pass";
    let pass = (sessionStorage.getItem(key) || "").trim();

    if (pass){
      const ok = await verifyAdminPassword(pass);
      if (ok) return pass;
      sessionStorage.removeItem(key);
    }

    pass = prompt("관리자 비밀번호를 입력하세요.");
    if (!pass) return null;

    const ok = await verifyAdminPassword(pass.trim());
    if (!ok){
      alert("비밀번호가 틀렸거나 권한이 없습니다.");
      return null;
    }

    sessionStorage.setItem(key, pass.trim());
    return pass.trim();
  }

  /*************************************************
   * ✅ (추가) 카드 7%를 DB에 “라인 아이템”으로도 저장해서
   * admin.html이 라인 합계를 다시 계산해도 7%가 안 날아가게 함
   *************************************************/
  const FEE_KIND = "fee7";
  const FEE_KO = "Service fee 7%";
  const FEE_VI = "Phí dịch vụ 7%";

  async function deleteFeeLine(orderId){
    const { error } = await sb
      .from("order_custom_items")
      .delete()
      .eq("order_id", orderId)
      .eq("kind", FEE_KIND);
    if (error) throw error;
  }

  async function insertFeeLineIfNeeded(orderId, adj){
    // adj.fee_* 는 “추가된 금액”
    if (!adj?.applied) return;
    if ((Number(adj.fee_vnd)||0) <= 0 && (Number(adj.fee_usd)||0) <= 0) return;

    const payload = [{
      order_id: orderId,
      kind: FEE_KIND,
      ko_name: FEE_KO,
      vi_name: FEE_VI,
      qty: 1,
      unit_usd: Number(adj.fee_usd) || 0,
      unit_vnd: Number(adj.fee_vnd) || 0,
      line_usd: Number(adj.fee_usd) || 0,
      line_vnd: Number(adj.fee_vnd) || 0
    }];

    const { error } = await sb.from("order_custom_items").insert(payload);
    if (error) throw error;
  }

  async function saveNewOrder(){
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;

    try{
      const { picked, totalUsd: baseUsd, totalVnd: baseVnd } = computePickedAndTotals();
      if (picked.length === 0){
        alert("저장할 메뉴가 없습니다.");
        return;
      }

      // ✅ 신규 저장도 비번 확인
      const pass = await requireAdminPassword();
      if (!pass) return;

      const guideName = (document.getElementById("guideName").value || "").trim();
      const teamNo = (document.getElementById("teamNo").value || "").trim();
      const paymentMethod = getPaymentMethod();

      // ✅ 저장 total은 카드 옵션 반영(7% 포함 선택 시 반영)
      const adj = applyCardFeeIfNeeded(baseUsd, baseVnd);

      // 1) orders 생성 (✅ 날짜 지정 가능: RPC 사용)
      toggleDatePickUI();
      const createdAtIso = getCreatedAtForSave();

      let orderId = null;
      try{
        const { data: newId, error: rpcErr } = await sb.rpc("admin_create_order_with_date", {
          p_password: pass,
          p_created_at: createdAtIso,
          p_source: "calc_web",
          p_status: "paid",
          p_total_usd: adj.usd,
          p_total_vnd: adj.vnd,
          p_guide_name: guideName || "",
          p_team_no: teamNo || "",
          p_payment_method: paymentMethod
        });
        if (rpcErr) throw rpcErr;
        orderId = newId;
      }catch(e){
        console.error(e);
        alert("주문 생성 실패 (RPC). 함수/비번/권한 확인");
        return;
      }

      if (!orderId){
        alert("주문 생성 실패: orderId가 없습니다.");
        return;
      }

      // 2) 일반 메뉴 -> order_items (라인은 기본 가격 그대로)
      const normalItems = picked.filter(p => p.kind === "menu");
      if (normalItems.length){
        const itemsPayload = normalItems.map(p => ({
          order_id: orderId,
          menu_item_id: p.id,
          qty: p.qty,
          unit_usd: p.unit_usd,
          unit_vnd: p.unit_vnd,
          line_usd: p.line_usd,
          line_vnd: p.line_vnd,
        }));
        const { error: itemsErr } = await sb.from("order_items").insert(itemsPayload);
        if (itemsErr) throw itemsErr;
      }

      // 3) SPECIAL -> order_custom_items
      const specialItems = picked.filter(p => p.kind === "special");
      if (specialItems.length){
        const customPayload = specialItems.map(p => ({
          order_id: orderId,
          kind: "special",
          ko_name: p.ko || "SPECIAL",
          vi_name: p.vi || null,
          qty: p.qty,
          unit_usd: p.unit_usd,
          unit_vnd: p.unit_vnd,
          line_usd: p.line_usd,
          line_vnd: p.line_vnd,
        }));
        const { error: cErr } = await sb.from("order_custom_items").insert(customPayload);
        if (cErr) throw cErr;
      }

      // ✅ (추가) 카드 7%면 “fee7” 라인도 저장
      await insertFeeLineIfNeeded(orderId, adj);

      alert("저장 완료!");

    } catch(e){
      console.error(e);
      alert("저장 실패");
    } finally{
      btn.disabled = false;
    }
  }

  async function saveEditOrder(){
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;

    try{
      const { picked, totalUsd: baseUsd, totalVnd: baseVnd } = computePickedAndTotals();
      if (picked.length === 0){
        alert("저장할 메뉴가 없습니다.");
        return;
      }

      // ✅ 수정 저장도 비번 확인
      const pass = await requireAdminPassword();
      if (!pass) return;

      const guideName = (document.getElementById("guideName").value || "").trim();
      const teamNo = (document.getElementById("teamNo").value || "").trim();
      const paymentMethod = getPaymentMethod();
      const normalItems = picked.filter(p => p.kind === "menu");
      const specialItems = picked.filter(p => p.kind === "special");

      // ✅ 저장 total은 카드 옵션 반영(7% 포함 선택 시 반영)
      const adj = applyCardFeeIfNeeded(baseUsd, baseVnd);

      const rpcItems = normalItems.map(p => ({
        menu_item_id: p.id,
        qty: p.qty,
        unit_usd: p.unit_usd,
        unit_vnd: p.unit_vnd,
        line_usd: p.line_usd,
        line_vnd: p.line_vnd,
        is_custom: false,
        custom_ko_name: "",
        custom_vi_name: ""
      }));

      const { data, error } = await sb.rpc("admin_update_order", {
        p_order_id: editOrderId,
        p_password: pass,
        p_guide_name: guideName || "",
        p_team_no: teamNo || "",
        p_payment_method: paymentMethod,
        p_items: rpcItems
      });

      if (error) throw error;
      if (data !== true){
        alert("비밀번호가 틀렸거나 권한이 없습니다.");
        sessionStorage.removeItem("hana_admin_pass");
        return;
      }

      // SPECIAL/fee7 재구성: 기존 삭제 후 다시 넣기
      const { error: delSpecialErr } = await sb
        .from("order_custom_items")
        .delete()
        .eq("order_id", editOrderId)
        .in("kind", ["special", FEE_KIND]); // ✅ special + fee7 같이 삭제
      if (delSpecialErr) throw delSpecialErr;

      if (specialItems.length){
        const payload = specialItems.map(p => ({
          order_id: editOrderId,
          kind: "special",
          ko_name: p.ko || "SPECIAL",
          vi_name: p.vi || null,
          qty: p.qty,
          unit_usd: p.unit_usd,
          unit_vnd: p.unit_vnd,
          line_usd: p.line_usd,
          line_vnd: p.line_vnd
        }));
        const { error: insErr } = await sb.from("order_custom_items").insert(payload);
        if (insErr) throw insErr;
      }

      // ✅ fee7 라인 다시 삽입(필요할 때만)
      await insertFeeLineIfNeeded(editOrderId, adj);

      // ✅ orders total 업데이트 (적용된 값으로)
      const { error: updErr } = await sb
        .from("orders")
        .update({ total_usd: adj.usd, total_vnd: adj.vnd })
        .eq("id", editOrderId);
      if (updErr) throw updErr;

      alert("수정 저장 완료!");
      location.href = "/admin.html";

    } catch(e){
      console.error(e);
      alert("수정 저장 실패");
    } finally{
      btn.disabled = false;
    }
  }

  async function loadOrderForEdit(orderId){
    // ✅ total도 함께 가져와서 (카드+7% 여부) 자동 추정
    const { data: meta, error: metaErr } = await sb
      .from("orders")
      .select("id,guide_name,team_no,payment_method,total_usd,total_vnd")
      .eq("id", orderId)
      .single();
    if (metaErr){ console.error(metaErr); alert("주문 메타 로드 실패"); return; }

    document.getElementById("guideName").value = meta.guide_name || "";
    document.getElementById("teamNo").value = meta.team_no || "";

    const pm = (meta.payment_method || "cash").toLowerCase();
    const radio = document.querySelector(`input[name="payMethod"][value="${pm}"]`);
    if (radio) radio.checked = true;

    // 초기화
    for (const k in qty) qty[k] = 0;
    document.querySelectorAll('input[data-act="qty"]').forEach(inp => { inp.value = 0; });
    specialLines.length = 0;

    const { data: items, error: itemsErr } = await sb
      .from("order_items")
      .select("menu_item_id,qty,unit_usd,unit_vnd")
      .eq("order_id", orderId);
    if (itemsErr){ console.error(itemsErr); alert("주문 라인 로드 실패"); return; }

    (items||[]).forEach(it => {
      if (!it.menu_item_id) return;
      qty[it.menu_item_id] = Number(it.qty||0);
      const card = document.querySelector(`.card[data-id="${it.menu_item_id}"]`);
      if (card){
        const input = card.querySelector('input[data-act="qty"]');
        input.value = qty[it.menu_item_id];
      }
    });

    const { data: cItems, error: cErr } = await sb
      .from("order_custom_items")
      .select("kind,ko_name,vi_name,qty,unit_usd,unit_vnd")
      .eq("order_id", orderId);
    if (cErr){ console.error(cErr); alert("SPECIAL 로드 실패"); return; }

    (cItems||[]).forEach(it=>{
      if ((it.kind||"").toLowerCase() !== "special") return;
      specialLines.push({
        id: uid(),
        ko: it.ko_name || "SPECIAL",
        vi: it.vi_name || "",
        qty: Number(it.qty||0),
        unit_usd: Number(it.unit_usd||0),
        unit_vnd: Number(it.unit_vnd||0)
      });
    });

    // ✅ 카드+7% 자동 추정:
    toggleCardFeeUI();
    const { totalVnd: baseVnd } = computePickedAndTotals();

    if (pm === "card"){
      // 1) fee7 라인이 있으면 우선 fee7로
      const hasFeeLine = (cItems||[]).some(x => (x.kind||"").toLowerCase() === FEE_KIND);
      const feeRadio = document.querySelector('input[name="cardFeeMode"][value="fee7"]');
      const noneRadio = document.querySelector('input[name="cardFeeMode"][value="none"]');

      if (feeRadio && noneRadio){
        if (hasFeeLine){
          feeRadio.checked = true;
        } else {
          // 2) 없으면 기존 로직(총액 비교)으로 추정
          const savedVnd = Number(meta.total_vnd || 0);
          const expected = roundTo1000(baseVnd * 1.07);
          const tol = Math.max(3000, Math.round(baseVnd * 0.01)); // 최소 3,000 VND 또는 1%
          if (Math.abs(savedVnd - expected) <= tol) feeRadio.checked = true;
          else noneRadio.checked = true;
        }
      }
    }

    document.getElementById("modeTitle").textContent = "Edit Mode (수정)";
    document.getElementById("saveBtn").textContent = "수정 저장 / Save";
    
    updateAll();
  }

  function setPrintTime(){
    const now = new Date();
    const date = now.toLocaleDateString("ko-KR", { year:"numeric", month:"2-digit", day:"2-digit" });
    const time = now.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
    const el = document.getElementById("printTime");
    if (el) el.textContent = `Printed: ${date} ${time}`;
  }

  // ✅ 프린트는 비번 안 물음
  document.getElementById("printBtn").addEventListener("click", () => { setPrintTime(); window.print(); });
  document.getElementById("resetBtn").addEventListener("click", resetAll);

  // ✅ 저장만 보호(신규/수정 모두)
  document.getElementById("saveBtn").addEventListener("click", async () => {
    if (isEditMode) await saveEditOrder();
    else await saveNewOrder();
  });

  window.addEventListener("beforeprint", setPrintTime);

  document.getElementById("spAddBtn").addEventListener("click", addSpecialLine);

  // ✅ 결제/카드옵션 바뀌면 즉시 총액 재계산
  document.getElementById("payOptions").addEventListener("change", () => updateAll());
  document.getElementById("cardFeeBox").addEventListener("change", () => updateAll());
  document.getElementById("goReservBtn").addEventListener("click", () => {
  location.href = "reserv_check.html"; // 같은 폴더
});

  // ✅ 날짜 옵션 UI 토글
  document.getElementById("dateOptions")?.addEventListener("change", () => toggleDatePickUI());
  document.getElementById("orderDateInput")?.addEventListener("change", () => toggleDatePickUI());

  (async function init(){
    const rows = await loadMenuFromDB();
    mountMenus(rows);

    if (isEditMode){
      await loadOrderForEdit(editOrderId);
    } else {
      toggleDatePickUI();
      updateAll();
    }
  })();
  </script>
</body>
</html>
