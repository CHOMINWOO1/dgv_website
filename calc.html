<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HANA Menu Calculator</title>
  <style>
    :root{
      --bg:#faf6ee;
      --card:#fffdf7;
      --ink:#3a2a1f;
      --sub:#6b5444;
      --line:#e7d7b8;
      --gold:#caa24c;
      --shadow: 0 10px 24px rgba(0,0,0,.10);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{
      max-width: 1200px;
      margin: 18px auto 60px;
      padding: 0 14px;
    }

    /* ===== (추가) HANA 헤더 ===== */
    .hanaHeader{
      width:100%;
      text-align:center;
      padding: 10px 10px 8px;
      margin: 0 0 14px;
      border-bottom: 1px solid #e4d1bf;
    }
    .hanaHeader .h1{
      margin:0;
      font-size:34px;
      font-weight:900;
      letter-spacing:.28em;
      color:#3f2a1d;
    }
    .hanaHeader .h2{
      margin:6px 0 10px;
      font-size:14px;
      font-weight:700;
      letter-spacing:.26em;
      color:#6a4c3a;
    }
    .hanaHeader .welcome{
      margin:0;
      padding:8px 0 10px;
      border-top:1px solid #e4d1bf;
      color:#3f2a1d;
      font-size:13px;
      line-height:1.4;
    }
    .hanaHeader .welcome span{
      display:block;
      color:#6e5a4a;
      font-size:12px;
    }

    /* ===== 상단 TOTAL + 인쇄 버튼 ===== */
    .summaryBar{
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }
    @media (max-width: 560px){
      .summaryBar{ grid-template-columns: 1fr; }
      .printWrap{ justify-content:flex-end; }
    }
    .printWrap{
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }
    .printBtnOnly{
      border:1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-weight:900;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
      height: fit-content;
      white-space: nowrap;
    }
    .printBtnOnly:hover{border-color: var(--gold)}

    /* ===== 섹션/카드 ===== */
    .section{ margin-top: 12px; }
    .section h2{
      margin: 12px 4px 10px;
      font-size: 16px;
      letter-spacing:.08em;
      text-transform: uppercase;
      color: var(--sub);
      font-weight: 900;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 920px){ .grid{grid-template-columns: repeat(2, minmax(0,1fr));} }
    @media (max-width: 560px){ .grid{grid-template-columns: 1fr;} }

    .card{
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 12px 10px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(202,162,76,.10), rgba(255,255,255,0) 60%);
      pointer-events:none;
    }

    /* ✅ 메뉴명 + 베트남어 */
    .name{
      font-weight: 1000;
      text-align:center;
      font-size: 18px;
      letter-spacing:.03em;
      margin: 2px 0 4px;
      position:relative;
    }
    .name small{
      display:block;
      margin-top:6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing:.02em;
      color: var(--sub);
    }

    .priceBox{
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: #f7eedc;
      position:relative;
    }
    .priceLine{
      display:flex; justify-content:center; align-items:baseline;
      gap:10px; flex-wrap:wrap;
    }
    .usd{
      font-size: 30px;
      font-weight: 1000;
      letter-spacing:.02em;
    }
    .vnd{
      font-size: 16px;
      font-weight: 900;
      color: var(--sub);
    }
    .qtyRow{
      display:flex; gap:10px; align-items:center; justify-content:center;
      margin-top: 10px;
      position:relative;
    }
    .step{
      width: 38px; height: 38px;
      border-radius: 12px;
      border:1px solid var(--line);
      background:#fff;
      font-size: 18px;
      font-weight: 1000;
      cursor:pointer;
    }
    .qty{
      width: 78px;
      text-align:center;
      padding: 9px 10px;
      border-radius: 12px;
      border:1px solid var(--line);
      font-weight: 1000;
      font-size: 16px;
      background:#fff;
    }
    .lineTotal{
      margin-top: 10px;
      text-align:center;
      font-weight: 900;
      color: var(--sub);
      font-size: 13px;
      position:relative;
    }
    .tag{
      display:inline-block;
      border:1px solid var(--line);
      background: #fffdf7;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      color: var(--sub);
      margin-left: 6px;
    }

    /* ===== TOTAL 카드 ===== */
    .sumCard{
      background: #fff;
      border:2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .sumTitle{
      font-weight: 1000;
      letter-spacing:.06em;
      text-transform: uppercase;
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .big{
      font-size: 34px;
      font-weight: 1000;
      letter-spacing:.02em;
    }
    .muted{color: var(--sub); font-weight:900}
    .list{
      margin-top: 10px;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      display:flex; flex-direction:column; gap:6px;
      font-size: 14px;
    }
    .row{
      display:flex; justify-content:space-between; gap:10px;
    }
    .row b{font-weight: 1000}

    /* ===== 날짜/시간: 인쇄 때만 보이게 ===== */
    .print-only{ display:none; }

    /* =========================
       인쇄: "헤더 + TOTAL 한 장만"
       ========================= */
    @media print {
      html, body{
        background:#fff !important;
        height:auto !important;
      }

      /* 메뉴 영역 숨김 */
      .section,
      .grid,
      .card,
      .wrap > *:not(.summaryBar):not(.hanaHeader){
        display:none !important;
      }

      /* 버튼 숨김 */
      .printWrap{ display:none !important; }

      /* 헤더 출력 */
      .hanaHeader{
        display:block !important;
        margin:0 0 10px !important;
      }

      /* TOTAL만 출력 */
      .summaryBar{
        display:block !important;
        margin:0 !important;
      }
      #sumLeft{
        display:block !important;
        box-shadow:none !important;
        border:1px solid #e7d7b8 !important;
        border-radius: 0 !important;
        width:100% !important;
        margin:0 !important;
        padding: 12px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      /* 인쇄 시 날짜/시간 표시 */
      .print-only{
        display:block !important;
        text-align:right !important;
        font-size:12px !important;
        color:#000 !important;
        margin-top: 10px !important;
      }

      @page { margin: 8mm; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- 헤더 -->
    <div class="hanaHeader">
      <div class="h1">H A N A</div>
      <div class="h2">K O R E A N &nbsp; R E S T A U R A N T</div>
      <p class="welcome">
        Welcome to HANA Korean Restaurant!
        <span>Chào mừng bạn đến với Nhà hàng Hàn Quốc HANA!</span>
      </p>
    </div>

    <!-- TOTAL + 인쇄 버튼 -->
    <div class="summaryBar">
      <div class="sumCard" id="sumLeft">
        <div class="sumTitle">Total</div>
        <div class="big"><span id="totalUsd">0</span>$</div>
        <div class="muted" style="font-size:16px;margin-top:4px;">
          <span id="totalVnd">0</span> VND
        </div>
        <div class="list" id="pickedList"></div>

        <!-- ✅ 인쇄 때만 날짜/시간 -->
        <div class="print-only" id="printTime"></div>
      </div>

      <div class="printWrap">
        <button class="printBtnOnly" id="printBtn">인쇄</button>
      </div>
    </div>

    <!-- ✅ 순서 변경: DRINK → SIDE -->
    <div class="section">
      <h2>DRINK MENU</h2>
      <div class="grid" id="drinkGrid"></div>
    </div>

    <div class="section">
      <h2>SIDE MENU</h2>
      <div class="grid" id="sideGrid"></div>
    </div>
  </div>

<script>
  // ====== 메뉴 데이터 (ko + vi 추가) ======
  const sideMenu = [
    { id:"shin",   ko:"신라면",           vi:"Mì Shin cay",           usd:4,  vnd:100000 },
    { id:"jjp",    ko:"짜파게티",         vi:"Mì tương đen (Jjapagetti)", usd:5,  vnd:120000 },
    { id:"buldak", ko:"불닭볶음면",       vi:"Mì xào cay Buldak",     usd:5,  vnd:120000 },
    { id:"naeng",  ko:"냉면",             vi:"Mì lạnh",              usd:8,  vnd:200000 },
    { id:"bibim",  ko:"비빔국수",         vi:"Mì trộn cay",           usd:8,  vnd:200000 },
    { id:"jjigae", ko:"찌개(김치/된장)",  vi:"Canh hầm (kimchi / tương đậu)", usd:8,  vnd:200000 },
    { id:"dagum",  ko:"다금바리 초무침",  vi:"Cá Dageumbari trộn cay", usd:20, vnd:500000 },
    { id:"yukhoe", ko:"육회",             vi:"Thịt bò sống trộn (Yukhoe)", usd:12, vnd:300000 },
    { id:"chicken",ko:"치킨",             vi:"Gà rán",               usd:14, vnd:340000 }
  ];

  const drinkMenu = [
    { id:"soju",   ko:"소주",         vi:"Soju",         usd:7, vnd:180000 },
    { id:"beer",   ko:"맥주",         vi:"Bia",          usd:2, vnd:50000  },
    { id:"soft",   ko:"음료",         vi:"Nước ngọt",    usd:1, vnd:30000  },
    { id:"mak",    ko:"막걸리",       vi:"Makgeolli",    usd:9, vnd:250000 },
    { id:"vodka",  ko:"보드카 MEN",   vi:"Vodka men",    usd:7, vnd:180000 },
    { id:"nep",    ko:"넵 모이",      vi:"Nếp mới",      usd:9, vnd:250000 },
    { id:"red",    ko:"레드 와인",    vi:"Rượu vang đỏ", usd:2, vnd:50000  },
    { id:"white",  ko:"화이트 와인",  vi:"Rượu vang trắng", usd:2, vnd:50000 },
    { id:"high",   ko:"하이볼",       vi:"Highball",     usd:4, vnd:100000 }
  ];

  // ====== 상태 ======
  const qty = Object.create(null);
  [...sideMenu, ...drinkMenu].forEach(m => qty[m.id] = 0);

  // ====== 유틸 ======
  const fmtInt = (n) => (Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const clampNonNegInt = (v) => {
    const x = Number(v);
    if (!Number.isFinite(x)) return 0;
    return Math.max(0, Math.floor(x));
  };

  // ====== 렌더 ======
  function makeCard(menu){
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = menu.id;

    card.innerHTML = `
      <div class="name">
        ${menu.ko}
        <small>${menu.vi}</small>
      </div>
      <div class="priceBox">
        <div class="priceLine">
          <div class="usd">${menu.usd}$</div>
          <div class="vnd">${fmtInt(menu.vnd)} VND</div>
        </div>
        <div class="qtyRow">
          <button class="step" data-act="dec">-</button>
          <input class="qty" data-act="qty" type="number" min="0" step="1" value="0" inputmode="numeric" />
          <button class="step" data-act="inc">+</button>
        </div>
        <div class="lineTotal">
          소계: <b><span data-act="lineUsd">0</span>$</b> · <b><span data-act="lineVnd">0</span> VND</b>
          <span class="tag" data-act="tag" style="display:none;">선택됨</span>
        </div>
      </div>
    `;

    card.addEventListener("click", (e) => {
      const act = e.target?.dataset?.act;
      if (!act) return;
      if (act === "inc") setQty(menu.id, qty[menu.id] + 1);
      if (act === "dec") setQty(menu.id, qty[menu.id] - 1);
    });

    const input = card.querySelector('input[data-act="qty"]');
    input.addEventListener("input", () => setQty(menu.id, input.value));

    return card;
  }

  function mount(){
    // ✅ 순서 변경: drinkGrid 먼저, sideGrid 나중
    const drinkGrid = document.getElementById("drinkGrid");
    const sideGrid  = document.getElementById("sideGrid");

    drinkMenu.forEach(m => drinkGrid.appendChild(makeCard(m)));
    sideMenu.forEach(m => sideGrid.appendChild(makeCard(m)));

    updateAll();
  }

  // ====== 로직 ======
  function setQty(id, v){
    qty[id] = clampNonNegInt(v);
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card){
      const input = card.querySelector('input[data-act="qty"]');
      if (document.activeElement !== input) input.value = qty[id];
    }
    updateAll();
  }

  function updateAll(){
    let totalUsd = 0;
    let totalVnd = 0;
    const picked = [];

    const all = [...drinkMenu, ...sideMenu]; // 표시 순서와 동일
    for (const m of all){
      const q = qty[m.id] || 0;
      const lineUsd = m.usd * q;
      const lineVnd = m.vnd * q;

      totalUsd += lineUsd;
      totalVnd += lineVnd;

      const card = document.querySelector(`.card[data-id="${m.id}"]`);
      if (card){
        card.querySelector('[data-act="lineUsd"]').textContent = fmtInt(lineUsd);
        card.querySelector('[data-act="lineVnd"]').textContent = fmtInt(lineVnd);
        const tag = card.querySelector('[data-act="tag"]');
        tag.style.display = q > 0 ? "inline-block" : "none";
      }

      if (q > 0) picked.push({ ko:m.ko, vi:m.vi, q, lineUsd, lineVnd });
    }

    document.getElementById("totalUsd").textContent = fmtInt(totalUsd);
    document.getElementById("totalVnd").textContent = fmtInt(totalVnd);

    const list = document.getElementById("pickedList");
    list.innerHTML = "";
    if (picked.length === 0){
      list.innerHTML = `<div class="muted">선택된 메뉴가 없습니다.</div>`;
    } else {
      picked.forEach(p => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div><b>${p.ko}</b><span style="color:#6b5444;font-weight:800;"> / ${p.vi}</span> × ${p.q}</div>
          <div>${fmtInt(p.lineUsd)}$ · ${fmtInt(p.lineVnd)} VND</div>
        `;
        list.appendChild(row);
      });
    }
  }

  // ====== 인쇄 시각 찍기 (인쇄할 때만 보임) ======
  function setPrintTime(){
    const now = new Date();
    const date = now.toLocaleDateString("ko-KR", { year:"numeric", month:"2-digit", day:"2-digit" });
    const time = now.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
    const el = document.getElementById("printTime");
    if (el) el.textContent = `Printed: ${date} ${time}`;
  }

  // 버튼 클릭 인쇄
  document.getElementById("printBtn").addEventListener("click", () => {
    setPrintTime();
    window.print();
  });

  // Ctrl+P 등으로 인쇄해도 시간 찍히게
  window.addEventListener("beforeprint", setPrintTime);

  // 시작
  mount();
</script>
</body>
</html>
