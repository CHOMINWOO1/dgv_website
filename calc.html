<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HANA Menu Calculator (USD + VND)</title>
  <style>
    :root{
      --bg:#faf6ee;
      --card:#fffdf7;
      --ink:#3a2a1f;
      --sub:#6b5444;
      --line:#e7d7b8;
      --gold:#caa24c;
      --shadow: 0 10px 24px rgba(0,0,0,.10);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{
      max-width: 1100px;
      margin: 22px auto 60px;
      padding: 0 14px;
    }
    header{
      display:flex; gap:12px; flex-wrap:wrap;
      align-items:flex-end; justify-content:space-between;
      margin-bottom:14px;
    }
    .title{
      font-weight: 900;
      letter-spacing:.08em;
      text-transform: uppercase;
      font-size: 22px;
    }
    .controls{
      display:flex; gap:10px; flex-wrap:wrap;
      align-items:center; justify-content:flex-end;
    }
    .control{
      background: var(--card);
      border:1px solid var(--line);
      border-radius: 12px;
      padding:10px 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      display:flex; gap:10px; align-items:center;
    }
    .control label{font-size:13px; color:var(--sub); font-weight:700}
    .control input{
      width: 140px;
      padding: 8px 10px;
      border:1px solid var(--line);
      border-radius: 10px;
      font-weight:800;
      color:var(--ink);
      background:#fff;
      outline:none;
    }
    .btn{
      border:1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-weight:900;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
    }
    .btn:hover{border-color: var(--gold)}
    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 920px){ .grid{grid-template-columns: repeat(2, minmax(0,1fr));} }
    @media (max-width: 560px){ .grid{grid-template-columns: 1fr;} }
@media print {
  /* 전체 숨김 */
  body * { visibility: hidden !important; }

  /* 요약 카드(#sumLeft)만 표시 */
  #sumLeft, #sumLeft * { visibility: visible !important; }

  /* 요약 카드만 페이지 맨 위로 */
  #sumLeft {
    position: fixed !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    margin: 0 !important;
    box-shadow: none !important;
    border: 1px solid #e7d7b8 !important;
    border-radius: 0 !important;
  }

  /* 인쇄 여백 최소화 */
  @page { margin: 8mm; }
}
    .section{
      margin-top: 18px;
    }
    .section h2{
      margin: 12px 4px 10px;
      font-size: 16px;
      letter-spacing:.08em;
      text-transform: uppercase;
      color: var(--sub);
      font-weight: 900;
    }
    .card{
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 12px 10px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(202,162,76,.10), rgba(255,255,255,0) 60%);
      pointer-events:none;
    }
    .name{
      font-weight: 1000;
      text-align:center;
      font-size: 18px;
      letter-spacing:.03em;
      margin: 2px 0 10px;
      position:relative;
    }
    .priceBox{
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: #f7eedc;
      position:relative;
    }
    .priceLine{
      display:flex; justify-content:center; align-items:baseline;
      gap:10px; flex-wrap:wrap;
    }
    .usd{
      font-size: 30px;
      font-weight: 1000;
      letter-spacing:.02em;
    }
    .vnd{
      font-size: 16px;
      font-weight: 900;
      color: var(--sub);
    }
    .qtyRow{
      display:flex; gap:10px; align-items:center; justify-content:center;
      margin-top: 10px;
      position:relative;
    }
    .step{
      width: 38px; height: 38px;
      border-radius: 12px;
      border:1px solid var(--line);
      background:#fff;
      font-size: 18px;
      font-weight: 1000;
      cursor:pointer;
    }
    .qty{
      width: 78px;
      text-align:center;
      padding: 9px 10px;
      border-radius: 12px;
      border:1px solid var(--line);
      font-weight: 1000;
      font-size: 16px;
      background:#fff;
    }
    .lineTotal{
      margin-top: 10px;
      text-align:center;
      font-weight: 900;
      color: var(--sub);
      font-size: 13px;
      position:relative;
    }

    .summary{
      margin-top: 18px;
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    @media (max-width: 920px){ .summary{grid-template-columns: 1fr;} }

    .sumCard{
      background: #fff;
      border:2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .sumTitle{
      font-weight: 1000;
      letter-spacing:.06em;
      text-transform: uppercase;
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .big{
      font-size: 34px;
      font-weight: 1000;
      letter-spacing:.02em;
    }
    .muted{color: var(--sub); font-weight:900}
    .list{
      margin-top: 10px;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      display:flex; flex-direction:column; gap:6px;
      font-size: 14px;
    }
    .row{
      display:flex; justify-content:space-between; gap:10px;
    }
    .row b{font-weight: 1000}
    .foot{
      margin-top: 10px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.45;
    }
    .tag{
      display:inline-block;
      border:1px solid var(--line);
      background: #fffdf7;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      color: var(--sub);
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="title">HANA 주문 계산기 (USD + VND)</div>
        <div class="muted" style="margin-top:6px;font-size:13px;">
          메뉴 수량을 입력하면 합계가 자동 계산됩니다.
        </div>
      </div>

      <div class="controls">
        <div class="control">
          <label for="rate">환율 (1 USD → VND)</label>
          <input id="rate" type="number" inputmode="numeric" min="1" step="1" value="25000" />
        </div>
        <button class="btn" id="resetBtn">전체 초기화</button>
        <button class="btn" id="printBtn">인쇄</button>
      </div>
    </header>

    <div class="summary">
      <div class="sumCard" id="sumLeft">
        <div class="sumTitle">Total</div>
        <div class="big"><span id="totalUsd">0</span>$</div>
        <div class="muted" style="font-size:16px;margin-top:4px;">
          <span id="totalVnd">0</span> VND
        </div>
        <div class="list" id="pickedList"></div>
        <div class="foot">
          * VND 표시는 환율 입력값 기준 자동 변환<br/>
          * 메뉴에 표기된 “만동”은 계산용으로만 사용 (표기 그대로 반영)
        </div>
      </div>

      <div class="sumCard">
        <div class="sumTitle">Quick Tips</div>
        <div class="muted" style="font-size:14px;line-height:1.6;">
          • 환율만 바꾸면 전체 자동 재계산<br/>
          • + / - 로 빠르게 수량 조절<br/>
          • 인쇄 버튼: 계산서처럼 출력 가능
        </div>
        <div class="foot">
          필요하면 “서비스/할인(%)”, “테이블 번호”, “메모”도 추가해줄게요.
        </div>
      </div>
    </div>

    <div class="section">
      <h2>SIDE MENU</h2>
      <div class="grid" id="sideGrid"></div>
    </div>

    <div class="section">
      <h2>DRINK MENU</h2>
      <div class="grid" id="drinkGrid"></div>
    </div>
  </div>

<script>
  // ====== 메뉴 데이터 (이미지에 있는 구성 그대로) ======
  // usd: 달러 가격
  // vnd: 동 가격 (정수 VND)
  const sideMenu = [
    { id:"shin",   name:"신라면",         usd:4,  vnd:100000 },
    { id:"jjp",    name:"짜파게티",       usd:5,  vnd:120000 },
    { id:"buldak", name:"불닭볶음면",     usd:5,  vnd:120000 },
    { id:"naeng",  name:"냉면",           usd:8,  vnd:200000 },
    { id:"bibim",  name:"비빔국수",       usd:8,  vnd:200000 },
    { id:"jjigae", name:"찌개(김치/된장)", usd:8, vnd:200000 },
    { id:"dagum",  name:"다금바리 초무침", usd:20, vnd:500000 },
    { id:"yukhoe", name:"육회",           usd:12, vnd:300000 },
    { id:"chicken",name:"치킨",           usd:14, vnd:340000 },
  ];

  const drinkMenu = [
    { id:"soju",   name:"소주",       usd:7, vnd:180000 },
    { id:"beer",   name:"맥주",       usd:2, vnd:50000  },
    { id:"soft",   name:"음료",       usd:1, vnd:30000  },
    { id:"mak",    name:"막걸리",     usd:9, vnd:250000 },
    { id:"vodka",  name:"보드카 MEN", usd:7, vnd:180000 },
    { id:"nep",    name:"넵 모이",    usd:9, vnd:250000 },
    { id:"red",    name:"레드 와인",  usd:2, vnd:50000  },
    { id:"white",  name:"화이트 와인",usd:2, vnd:50000  },
    { id:"high",   name:"하이볼",     usd:4, vnd:100000 },
  ];

  // ====== 상태 ======
  const qty = Object.create(null); // id -> number
  [...sideMenu, ...drinkMenu].forEach(m => qty[m.id] = 0);

  // ====== 유틸 ======
  const fmtInt = (n) => (Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const clampNonNegInt = (v) => {
    const x = Number(v);
    if (!Number.isFinite(x)) return 0;
    return Math.max(0, Math.floor(x));
  };

  // ====== 렌더 ======
  function makeCard(menu){
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = menu.id;

    card.innerHTML = `
      <div class="name">${menu.name}</div>
      <div class="priceBox">
        <div class="priceLine">
          <div class="usd">${menu.usd}$</div>
          <div class="vnd">${fmtInt(menu.vnd)} VND</div>
        </div>
        <div class="qtyRow">
          <button class="step" data-act="dec">-</button>
          <input class="qty" data-act="qty" type="number" min="0" step="1" value="0" inputmode="numeric" />
          <button class="step" data-act="inc">+</button>
        </div>
        <div class="lineTotal">
          소계: <b><span data-act="lineUsd">0</span>$</b> · <b><span data-act="lineVnd">0</span> VND</b>
          <span class="tag" data-act="tag" style="display:none;">선택됨</span>
        </div>
      </div>
    `;

    // 이벤트
    card.addEventListener("click", (e) => {
      const act = e.target?.dataset?.act;
      if (!act) return;
      if (act === "inc") setQty(menu.id, qty[menu.id] + 1);
      if (act === "dec") setQty(menu.id, qty[menu.id] - 1);
    });

    const input = card.querySelector('input[data-act="qty"]');
    input.addEventListener("input", () => setQty(menu.id, input.value));

    return card;
  }

  function mount(){
    const sideGrid = document.getElementById("sideGrid");
    const drinkGrid = document.getElementById("drinkGrid");
    sideMenu.forEach(m => sideGrid.appendChild(makeCard(m)));
    drinkMenu.forEach(m => drinkGrid.appendChild(makeCard(m)));
    updateAll();
  }

  // ====== 로직 ======
  function setQty(id, v){
    qty[id] = clampNonNegInt(v);
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card){
      const input = card.querySelector('input[data-act="qty"]');
      if (document.activeElement !== input) input.value = qty[id];
    }
    updateAll();
  }

  function getRate(){
    const r = clampNonNegInt(document.getElementById("rate").value);
    return r > 0 ? r : 25000;
  }

  function updateAll(){
    const rate = getRate();

    let totalUsd = 0;
    let totalVndFixed = 0; // 메뉴에 적힌 VND 합계(환율 무관)
    const picked = [];

    const all = [...sideMenu, ...drinkMenu];
    for (const m of all){
      const q = qty[m.id] || 0;
      const lineUsd = m.usd * q;
      const lineVndFixed = m.vnd * q;

      totalUsd += lineUsd;
      totalVndFixed += lineVndFixed;

      // 카드 업데이트
      const card = document.querySelector(`.card[data-id="${m.id}"]`);
      if (card){
        card.querySelector('[data-act="lineUsd"]').textContent = fmtInt(lineUsd);
        card.querySelector('[data-act="lineVnd"]').textContent = fmtInt(lineVndFixed);
        const tag = card.querySelector('[data-act="tag"]');
        tag.style.display = q > 0 ? "inline-block" : "none";
      }

      if (q > 0) picked.push({ name:m.name, q, usd:m.usd, vnd:m.vnd, lineUsd, lineVndFixed });
    }

    // 합계 표시:
    // - totalUsd: 달러 합계(메뉴 USD 기반)
    // - totalVnd: (1) 메뉴에 적힌 VND 합계 + (2) 달러 합계를 환율로 변환한 값 중 선택 가능
    //   여기서는 "메뉴에 적힌 VND 합계"를 기본으로 사용 (메뉴판과 1:1 일치)
    document.getElementById("totalUsd").textContent = fmtInt(totalUsd);
    document.getElementById("totalVnd").textContent = fmtInt(totalVndFixed);

    // 선택 목록
    const list = document.getElementById("pickedList");
    list.innerHTML = "";
    if (picked.length === 0){
      list.innerHTML = `<div class="muted">선택된 메뉴가 없습니다.</div>`;
    } else {
      picked.forEach(p => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div><b>${p.name}</b> × ${p.q}</div>
          <div>${fmtInt(p.lineUsd)}$ · ${fmtInt(p.lineVndFixed)} VND</div>
        `;
        list.appendChild(row);
      });

      // 참고: 환율 변환 총액도 보여주고 싶으면 아래 줄을 “추가 표시”로 넣으면 됨
      const conv = document.createElement("div");
      conv.className = "foot";
      conv.style.marginTop = "10px";
      conv.innerHTML = `
        환율 기준 달러합계→VND: <b>${fmtInt(totalUsd * rate)}</b> VND (rate=${fmtInt(rate)})
      `;
      list.appendChild(conv);
    }
  }

  // ====== 컨트롤 ======
  document.getElementById("rate").addEventListener("input", updateAll);

  document.getElementById("resetBtn").addEventListener("click", () => {
    Object.keys(qty).forEach(k => qty[k] = 0);
    document.querySelectorAll('input[data-act="qty"]').forEach(inp => inp.value = 0);
    updateAll();
  });

  document.getElementById("printBtn").addEventListener("click", () => window.print());

  // 시작
  mount();
</script>
</body>
</html>
