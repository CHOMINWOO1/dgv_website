<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#faf6ee" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
  <title>HANA 주문 접수</title>
  <link rel="stylesheet" href="assets/qr-staff.css" />
</head>
<body>
  <main class="qr-shell">
    <header class="qr-header">
      <div>
        <h1 class="qr-brand-title">HANA ORDER</h1>
        <p class="qr-brand-subtitle">Table order inbox</p>
      </div>
      <div class="qr-header-actions">
        <span class="qr-pill" aria-live="polite">
          <span class="qr-dot is-connecting" id="connectionDot"></span>
          <span id="connectionText">연결 중</span>
        </span>
        <button class="qr-btn" type="button" id="soundBtn">🔔 알림음 켜기</button>
        <button class="qr-btn" type="button" id="refreshBtn">새로고침</button>
        <a class="qr-btn qr-btn-primary" id="menuAdminLink" href="menu_admin.html" hidden>메뉴 관리</a>
        <button class="qr-btn" type="button" id="signOutBtn">로그아웃</button>
      </div>
    </header>

    <div class="qr-banner" id="inboxBanner" hidden></div>

    <section class="qr-summary" aria-label="주문 현황">
      <article class="qr-card qr-summary-card">
        <div class="qr-summary-label">신규 주문</div>
        <div class="qr-summary-value" id="submittedCount">0</div>
      </article>
      <article class="qr-card qr-summary-card">
        <div class="qr-summary-label">주문 확인</div>
        <div class="qr-summary-value" id="acceptedCount">0</div>
      </article>
      <article class="qr-card qr-summary-card">
        <div class="qr-summary-label">매출 등록 완료</div>
        <div class="qr-summary-value" id="finalizedCount">0</div>
      </article>
      <article class="qr-card qr-summary-card">
        <div class="qr-summary-label">현재 표시</div>
        <div class="qr-summary-value" id="visibleCount">0</div>
      </article>
    </section>

    <section class="qr-card qr-card-pad">
      <div class="qr-section-head">
        <div>
          <h2 class="qr-section-title">테이블 주문</h2>
          <div class="qr-hint" id="lastSyncText">아직 동기화되지 않았습니다.</div>
        </div>
        <div class="qr-filter-row">
          <label class="qr-hint" for="statusFilter">상태</label>
          <select class="qr-select" id="statusFilter">
            <option value="current">현재 주문 전체</option>
            <option value="submitted">신규 주문</option>
            <option value="accepted">주문 확인</option>
            <option value="cancelled">취소</option>
            <option value="all">최근 주문 전체</option>
          </select>
        </div>
      </div>

      <div class="qr-orders" id="ordersGrid" aria-live="polite">
        <div class="qr-empty">주문을 불러오는 중입니다…</div>
      </div>
    </section>
  </main>

  <div class="qr-modal-back" id="loginModal" hidden>
    <form class="qr-modal" id="loginForm">
      <h2>주문 화면 로그인</h2>
      <p>직원은 주문을 처리하고, 관리자는 주문 처리와 결제 완료 등록을 할 수 있습니다.</p>
      <div class="qr-field" style="margin-bottom:10px">
        <label class="qr-label" for="loginRole">접근 권한</label>
        <select class="qr-select" id="loginRole">
          <option value="staff">직원</option>
          <option value="admin">관리자</option>
        </select>
      </div>
      <input class="qr-input" id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required />
      <div class="qr-form-actions">
        <button class="qr-btn qr-btn-primary" id="loginConfirm" type="submit">입장</button>
      </div>
      <div class="qr-hint">브라우저 탭을 닫으면 로그인이 해제됩니다.</div>
    </form>
  </div>

  <div class="qr-modal-back" id="paymentModal" hidden>
    <form class="qr-modal" id="paymentForm">
      <h2>최종 결제</h2>
      <p>온라인 결제가 아닙니다. 현장에서 결제를 받은 뒤 확정하면 admin 매출에 한 번만 등록됩니다.</p>
      <div class="qr-field">
        <label class="qr-label" for="paymentMethod">결제 수단</label>
        <select class="qr-select" id="paymentMethod" required>
          <option value="cash">현금</option>
          <option value="card">카드</option>
          <option value="bank">계좌이체</option>
        </select>
      </div>
      <div class="qr-field" style="margin-top:10px">
        <label class="qr-label" for="paymentGuide">가이드명 (선택)</label>
        <input class="qr-input" id="paymentGuide" maxlength="80" />
      </div>
      <div class="qr-field" style="margin-top:10px">
        <label class="qr-label" for="paymentTeam">팀 번호 (선택)</label>
        <input class="qr-input" id="paymentTeam" maxlength="80" />
      </div>
      <div class="qr-form-actions">
        <button class="qr-btn" id="paymentCancel" type="button">닫기</button>
        <button class="qr-btn qr-btn-ok" id="paymentConfirm" type="submit">최종 결제</button>
      </div>
    </form>
  </div>

  <div class="qr-toast-stack" id="qrToastStack" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/dgv-data.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/qr-staff.js"></script>
  <script src="assets/order-inbox.js"></script>
</body>
</html>
