<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HANA Pages</title>
  <link rel="stylesheet" href="assets/qr-staff.css" />
  <style>
    :root{
      --bg:#faf6ee;
      --card:#fffdf7;
      --ink:#3a2a1f;
      --sub:#6b5444;
      --line:#e7d7b8;
      --gold:#caa24c;
      --shadow:0 10px 24px rgba(0,0,0,.10);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html{ -webkit-text-size-adjust:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{max-width:980px;margin:22px auto 60px;padding:0 14px;}
    .hanaHeader{
      width:100%;
      text-align:center;
      padding: 10px 10px 8px;
      margin: 0 0 16px;
      border-bottom: 1px solid #e4d1bf;
    }
    .hanaHeader .h1{
      margin:0;
      font-size:34px;
      font-weight:900;
      letter-spacing:.28em;
      color:#3f2a1d;
    }
    .hanaHeader .h2{
      margin:6px 0 10px;
      font-size:14px;
      font-weight:700;
      letter-spacing:.26em;
      color:#6a4c3a;
    }
    .card{
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      overflow:hidden;
      position:relative;
    }
    .card:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(202,162,76,.10), rgba(255,255,255,0) 60%);
      pointer-events:none;
    }
    .title{
      position:relative;
      font-weight:1000;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--sub);
      font-size:14px;
      margin-bottom:10px;
    }
    .grid{
      position:relative;
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width:560px){
      .grid{grid-template-columns: 1fr;}
    }
    .btn{
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:flex-start;
      width:100%;
      padding:14px 14px;
      border-radius: 14px;
      border:1px solid var(--line);
      background:#fff;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
      text-align:left;
      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .05s ease, filter .15s ease, border-color .15s ease;
    }
    .btn:hover{ border-color: var(--gold); filter: brightness(.99); }
    .btn:active{ transform: translateY(1px); }
    .btn .name{
      font-weight:1000;
      font-size:18px;
      color:var(--ink);
      letter-spacing:.02em;
    }
    .btn .desc{
      font-weight:900;
      font-size:13px;
      color:var(--sub);
      line-height:1.35;
    }
    .hint{
      margin-top:12px;
      font-size:12px;
      color:var(--sub);
      font-weight:900;
      opacity:.9;
    }
    .path{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:12px;
      color:#775d4e;
      font-weight:800;
      margin-top:2px;
    }
    .locked .wrap{
      pointer-events:none;
      user-select:none;
    }
    .locked .wrap:after{
      content:"";
      position:fixed;
      inset:0;
      z-index:9998;
      background:rgba(250,246,238,.66);
    }
    .qr-modal-back{z-index:10000;}
  </style>
</head>
<body class="locked">
  <div class="wrap">
    <div class="hanaHeader">
      <div class="h1">H A N A</div>
      <div class="h2">P A G E &nbsp; N A V I G A T I O N</div>
    </div>

    <div class="card">
      <div class="title">Quick Links</div>

      <div class="grid">
        <a class="btn" href="calc.html">
          <div class="name">식당 메뉴 추가</div>
          <div class="desc">Thêm thực đơn nhà hàng</div>
        </a>

        <a class="btn" href="order_inbox.html">
          <div class="name">인박스 오더</div>
          <div class="desc">Nhận đơn gọi món</div>
        </a>

        <a class="btn" href="reserv_check.html">
          <div class="name">식당 예약 현황(직원용)</div>
          <div class="desc">Xác nhận đặt chỗ theo nhóm (Dành cho nhân viên)</div>
        </a>
      </div>
      <div class="hint">
      </div>
    </div>
  </div>

  <div class="qr-modal-back" id="loginModal" hidden>
    <form class="qr-modal" id="loginForm" role="dialog" aria-modal="true" aria-labelledby="loginTitle" aria-describedby="loginDescription">
      <h2 id="loginTitle">직원 로그인</h2>
      <p id="loginDescription">직원 비밀번호를 입력하면 직원용 홈에 입장합니다.</p>
      <label class="qr-label" for="loginPassword">직원 비밀번호</label>
      <input class="qr-input" id="loginPassword" type="password" placeholder="직원 비밀번호" autocomplete="current-password" required />
      <div class="qr-button-row" style="margin-top:12px;justify-content:flex-end;">
        <button class="qr-btn qr-btn-primary" id="loginConfirm" type="submit">입장</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/dgv-data.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/qr-staff.js"></script>
  <script>
    (async function initStaffHome(){
      try{
        await QRStaff.requireLogin({ roles:["staff", "admin"], preferredRole:"staff" });
        document.body.classList.remove("locked");
      } catch(error){
        console.error(error);
        QRStaff.toast("로그인 화면을 불러오지 못했습니다. 페이지를 새로고침해 주세요.", "error");
      }
    })();
  </script>
</body>
</html>
