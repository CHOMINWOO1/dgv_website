<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Staff - Group Reservations</title>
  <style>
    :root{
      --bg:#faf6ee; --card:#fffdf7; --ink:#3a2a1f; --sub:#6b5444;
      --line:#e7d7b8; --gold:#caa24c; --shadow:0 10px 24px rgba(0,0,0,.10);
      --radius:16px; --ok:#1b7f3a; --bad:#b42318;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{max-width:1200px;margin:18px auto;padding:0 12px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
    h1{margin:0;font-size:18px}
    .sub{margin:4px 0 0;color:var(--sub);font-size:12px}
    .mode-pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;
      font-size:12px;font-weight:900;color:var(--sub);
    }

    .controls{
      margin:12px 0 10px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
    }
    label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px}
    select{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      min-width:160px;
    }
    button{
      border:0; cursor:pointer; border-radius:12px; padding:10px 12px;
      font-weight:900; letter-spacing:.02em;
    }
    .btn-primary{background:var(--gold);color:#2b1e14}
    .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .btn-mini{border-radius:999px;padding:8px 10px}

    .stats{
      display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 12px;
    }
    .stat{
      background:#fff; border:1px solid var(--line); border-radius:999px;
      padding:8px 12px; font-size:12px; color:var(--sub); font-weight:900;
    }
    .stat b{color:var(--ink)}

    /* ===== Desktop Table ===== */
    .table-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }
    table{width:100%;border-collapse:collapse;min-width:980px}
    th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px;vertical-align:top}
    th{background:#fff7e8;font-size:12px;color:var(--sub);white-space:nowrap}
    .menu{font-weight:900}
    .muted{color:var(--sub);font-size:12px}
    .note{white-space:pre-wrap;color:var(--sub);font-size:13px}

    /* ===== Mobile Cards ===== */
    .cards{display:none; gap:10px; flex-direction:column}
    .r-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      box-shadow:0 8px 18px rgba(0,0,0,.06);
    }
    .r-top{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      margin-bottom:10px;
    }
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff7e8;
      font-size:12px;
      font-weight:900;
      color:var(--ink);
      white-space:nowrap;
    }
    .badge.sub{background:#fff;color:var(--sub);font-weight:900}
    .kv{
      display:grid;
      grid-template-columns:90px 1fr;
      gap:8px 10px;
      align-items:start;
      font-size:14px;
    }
    .k{color:var(--sub);font-size:12px;font-weight:900}
    .v{color:var(--ink)}
    .v .muted{display:block;margin-top:2px}
    .note-box{
      margin-top:8px;
      padding-top:8px;
      border-top:1px dashed #f0dfbf;
    }
    .note-text{
      white-space:pre-wrap;
      color:var(--sub);
      font-size:13px;
      line-height:1.4;
    }
    .note-collapsed{
      display:-webkit-box;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .more{
      margin-top:8px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      font-weight:900;
      cursor:pointer;
      font-size:12px;
      color:var(--ink);
    }

    @media (max-width:820px){
      /* 모바일에서는 테이블 숨기고 카드 표시 */
      .table-wrap{display:none}
      .cards{display:flex}
      select{min-width:140px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1>Yêu cầu đặt phòng nhóm</h1>
          
        </div>
        <div class="mode-pill" id="modePill">모드: 오늘 이후 전체</div>
      </div>

      <div class="controls">
        <div>
          <label>BRANCH</label>
          <select id="q_branch">
            <option value="">Tất cả</option>
          </select>
        </div>

        <div style="display:flex;gap:8px;">
          <button class="btn-ghost btn-mini" id="btnToday" type="button">Hôm nay</button>
          <button class="btn-ghost btn-mini" id="btnTomorrow" type="button">Ngày mai</button>
          <button class="btn-primary btn-mini" id="btnFromToday" type="button">tất cả</button>
        </div>
        <!-- ✅ RANGE: 기간 조회 UI -->
<div id="rangeBox" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
  <div>
    <label>FROM</label>
    <input id="q_from" type="date"
      style="padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;min-width:160px;">
  </div>
  <div>
    <label>TO</label>
    <input id="q_to" type="date"
      style="padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;min-width:160px;">
  </div>
  <button class="btn-ghost btn-mini" id="btnRange" type="button">기간조회</button>
</div>


        <button class="btn-ghost" id="btnRefresh" type="button">Quay lại</button>
      </div>

      <div class="stats" id="stats" style="display:none;"></div>

      <!-- Desktop Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>DATE</th>
              <th>TIME</th>
              <th>BRANCH</th>
              <th>GUESTS</th>
              <th>PRICE</th>
              <th>MENU</th>
              <th>NOTE</th>
              <th>GUIDE</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="muted">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Mobile Cards -->
      <div class="cards" id="cards"></div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    // ===== Access Gate =====
const ACCESS_OK_KEY = "hana_access_ok";

async function requireAccessGate(){
  if (sessionStorage.getItem(ACCESS_OK_KEY) === "1") return true;

  while(true){
    const code = prompt("보안코드를 입력하세요.");
    if (!code) return false;

    const { data: ok, error } = await fetch(`${SUPABASE_URL}/rest/v1/rpc/check_page_access_code`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ p_code: code.trim() })
    }).then(r => r.json().then(j => ({ data: j, error: null })).catch(()=>({data:null,error:true})));

    if (ok === true){
      sessionStorage.setItem(ACCESS_OK_KEY, "1");
      return true;
    }

    alert("코드가 틀렸습니다.");
  }
}

    const SUPABASE_URL = "https://qzuynzreamdkpmakvefm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_cr1uTfwC5-yOXoV8Ice1_w_3Eqg1cZ_";

    const BRANCH_PRESETS = ["KT","ANT","AST","엠투어","기쁨","JM","TOT","투어패밀리","빅트래블","실크로드","HANA","OTHER"];

    const $ = id => document.getElementById(id);
    function ymd(d){ return d.toISOString().slice(0,10); }

    function formatVND(n){
      if(n === null || n === undefined || n === "") return "";
      const x = Number(n);
      if(!Number.isFinite(x) || x === 0) return "";
      return x.toLocaleString("en-US") + " VND";
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    async function fetchJson(url){
      const res = await fetch(url, {
        headers:{
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY
        }
      });
      const text = await res.text();
      let json=null; try{ json = text ? JSON.parse(text) : null; }catch{}
      if(!res.ok){
        const err = (json && (json.message || json.error)) || text || ("HTTP " + res.status);
        throw new Error(err);
      }
      return json;
    }

    // mode: today | fromToday | tomorrow | range
    let MODE = "today";

   function setMode(mode){
  MODE = mode;

  $("modePill").textContent =
    (MODE === "today") ? "Mode: Hôm nay" :
    (MODE === "tomorrow") ? "Mode: Ngày mai" :
    (MODE === "range") ? "Mode: 기간" :
    "Mode: tất cả";

  ["btnToday","btnTomorrow","btnFromToday","btnRange"].forEach(id=>{
    const el = $(id); if(!el) return;
    el.classList.add("btn-ghost");
    el.classList.remove("btn-primary");
  });

  if(MODE === "today"){
    $("btnToday").classList.add("btn-primary");
    $("btnToday").classList.remove("btn-ghost");
  }else if(MODE === "tomorrow"){
    $("btnTomorrow").classList.add("btn-primary");
    $("btnTomorrow").classList.remove("btn-ghost");
  }else if(MODE === "range"){
    $("btnRange").classList.add("btn-primary");
    $("btnRange").classList.remove("btn-ghost");
  }else{
    $("btnFromToday").classList.add("btn-primary");
    $("btnFromToday").classList.remove("btn-ghost");
  }
}



    async function load(){
  const now = new Date();

  const today = ymd(now);

  // ✅ 내일 계산 (로컬 기준)
  const tmr = new Date(now);
  tmr.setDate(tmr.getDate() + 1);
  const tomorrow = ymd(tmr);

  const branch = $("q_branch").value;

  let url =
    `${SUPABASE_URL}/rest/v1/resv_groups` +
    `?select=id,res_date,res_time,guests_count,price,menu_ko,menu_vi,note,branch,guide_name`;

  // ✅ MODE별 날짜 필터
    // ✅ MODE별 날짜 필터
  if(MODE === "today"){
    url += `&res_date=eq.${today}`;
  }else if(MODE === "tomorrow"){
    url += `&res_date=eq.${tomorrow}`;
  }else if(MODE === "range"){
    const from = $("q_from").value;
    const to   = $("q_to").value;

    // 값이 없으면 today 기준으로 안전하게 동작
    const f = from || today;
    const t = to || from || today;

    // from > to 방지
    const f2 = (f <= t) ? f : t;
    const t2 = (f <= t) ? t : f;

    // Supabase filter: gte / lte
    url += `&res_date=gte.${f2}&res_date=lte.${t2}`;
  }else{
    url += `&res_date=gte.${today}`;
  }


  if(branch){
    url += `&branch=eq.${encodeURIComponent(branch)}`;
  }

  url += `&order=res_date.asc,res_time.asc`;

  const rows = await fetchJson(url);
  renderAll(Array.isArray(rows) ? rows : []);
}


    function renderStats(rows){
      const totalGuests = rows.reduce((a,r)=>a + (Number(r.guests_count)||0), 0);
      const totalPrice  = rows.reduce((a,r)=>a + (Number(r.price)||0), 0);

      $("stats").style.display = rows.length ? "flex" : "none";
      $("stats").innerHTML = `
        <div class="stat">con số <b>${rows.length}</b></div>
        <div class="stat">tổng số người <b>${totalGuests}</b></div>
      `;
    }

    function renderTable(rows){
      const tb = $("tbody");
      if(!rows.length){
        tb.innerHTML = `<tr><td colspan="8" class="muted">예약 없음</td></tr>`;
        return;
      }

      tb.innerHTML = rows.map(r => `
        <tr>
          <td>${escapeHtml(r.res_date || "")}</td>
          <td>${escapeHtml((r.res_time || "").slice(0,5))}</td>
          <td>${escapeHtml(r.branch || "")}</td>
          <td>${escapeHtml(String(r.guests_count ?? ""))}</td>
          <td>${escapeHtml(formatVND(r.price))}</td>
          <td>
            <div class="menu">${escapeHtml(r.menu_ko || "")}</div>
            <div class="muted">${escapeHtml(r.menu_vi || "")}</div>
          </td>
          <td class="note">${escapeHtml(r.note || "")}</td>
          <td>${escapeHtml(r.guide_name || "")}</td>
        </tr>
      `).join("");
    }

    function renderCards(rows){
      const wrap = $("cards");
      if(!rows.length){
        wrap.innerHTML = `<div class="muted" style="padding:6px 2px;">예약 없음</div>`;
        return;
      }

      wrap.innerHTML = rows.map(r => {
        const note = (r.note || "").trim();
        const hasLong = note.length > 80;

        return `
          <div class="r-card" data-id="${escapeHtml(r.id)}">
            <div class="r-top">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <span class="badge">${escapeHtml(r.res_date || "")}</span>
                <span class="badge sub">${escapeHtml((r.res_time || "").slice(0,5) || "")}</span>
                <span class="badge sub">${escapeHtml(r.branch || "")}</span>
              </div>
              <span class="badge">👥 ${escapeHtml(String(r.guests_count ?? ""))}</span>
            </div>

            <div class="kv">
              <div class="k">PRICE</div>
              <div class="v">${escapeHtml(formatVND(r.price))}</div>

              <div class="k">MENU</div>
              <div class="v">
                <div class="menu">${escapeHtml(r.menu_ko || "")}</div>
                <span class="muted">${escapeHtml(r.menu_vi || "")}</span>
              </div>

              <div class="k">GUIDE</div>
              <div class="v">${escapeHtml(r.guide_name || "")}</div>
            </div>

            <div class="note-box">
              <div class="k" style="margin-bottom:6px;">NOTE</div>
              <div class="note-text ${hasLong ? "note-collapsed" : ""}" id="note_${escapeHtml(r.id)}">${escapeHtml(note)}</div>
              ${hasLong ? `<button class="more" type="button" data-toggle="${escapeHtml(r.id)}">펼치기</button>` : ``}
            </div>
          </div>
        `;
      }).join("");

      // toggle note
      wrap.querySelectorAll('button[data-toggle]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.getAttribute('data-toggle');
          const noteEl = document.getElementById('note_' + id);
          const collapsed = noteEl.classList.toggle('note-collapsed');
          btn.textContent = collapsed ? '펼치기' : '접기';
        });
      });
    }

    function renderAll(rows){
      renderStats(rows);
      renderTable(rows);
      renderCards(rows);
    }

    function buildBranch(){
      const sel = $("q_branch");
      BRANCH_PRESETS.forEach(b=>{
        const o=document.createElement("option");
        o.value=b; o.textContent=b;
        sel.appendChild(o);
      });
    }

    $("btnToday").addEventListener("click", () => { setMode("today"); load(); });
    $("btnFromToday").addEventListener("click", () => { setMode("fromToday"); load(); });
    $("btnRefresh").addEventListener("click", load);
    $("q_branch").addEventListener("change", load);
    $("btnTomorrow").addEventListener("click", () => { setMode("tomorrow"); load(); });
    $("btnRange").addEventListener("click", () => { setMode("range"); load(); });
$("q_from").addEventListener("change", () => { setMode("range"); load(); });
$("q_to").addEventListener("change", () => { setMode("range"); load(); });



    // init
    (async function init(){
  const ok = await requireAccessGate();
  if(!ok){
    location.href = "/";
    return;
  }

  buildBranch();
  setMode("today");
  load();
})();

  </script>
</body>
</html>
