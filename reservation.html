<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Group Reservation Input</title>
  <style>
    :root{
      --bg:#faf6ee; --card:#fffdf7; --ink:#3a2a1f; --sub:#6b5444;
      --line:#e7d7b8; --gold:#caa24c; --shadow:0 10px 24px rgba(0,0,0,.10);
      --radius:16px; --ok:#1b7f3a; --bad:#b42318;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;
      background: radial-gradient(1400px 700px at 50% -200px, #fff 0%, var(--bg) 60%);
      color:var(--ink);
    }
    .wrap{max-width:980px;margin:28px auto;padding:0 16px}
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:18px;
    }
    .top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
    h1{margin:0;font-size:20px;letter-spacing:.02em}
    .sub{margin:4px 0 0;color:var(--sub);font-size:13px}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px}
    input,select,textarea{
      width:100%; padding:12px 12px; border-radius:12px;
      border:1px solid var(--line); background:#fff; color:var(--ink);
      outline:none;
    }
    textarea{min-height:92px;resize:vertical}
    .span2{grid-column:span 2}
    .span3{grid-column:1/-1}
    .mini{font-size:12px;color:var(--sub);margin-top:6px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    button{
      border:0; cursor:pointer; border-radius:12px; padding:12px 14px;
      font-weight:900; letter-spacing:.02em;
    }
    .btn-primary{background:var(--gold);color:#2b1e14}
    .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .btn-primary:disabled,.btn-ghost:disabled{opacity:.55;cursor:not-allowed}
    .msg{margin-top:12px;font-size:14px}
    .ok{color:var(--ok);font-weight:900}
    .bad{color:var(--bad);font-weight:900}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;
      color:var(--sub);font-size:12px;font-weight:900;
    }

    .time-row{display:flex;gap:10px;align-items:center}
    .time-row input{flex:1}
    .time-preview{
      min-width:92px;
      text-align:center;
      padding:10px 10px;
      border:1px dashed var(--line);
      border-radius:12px;
      color:var(--sub);
      font-weight:900;
      background:#fff;
    }

    @media (max-width:900px){
      .grid{grid-template-columns:1fr 1fr}
      .span2{grid-column:1/-1}
    }
    @media (max-width:720px){
      .grid{grid-template-columns:1fr}
      .two{grid-template-columns:1fr}
      .time-preview{min-width:78px}
    }

    /* ===== Modal (admin.html 스타일) ===== */
    .modalBack{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      display:none; align-items:center; justify-content:center;
      padding:14px; z-index:9999;
    }
    .modal{
      width:min(420px, 100%);
      background:var(--card);
      border:2px solid var(--line);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.20);
      padding:14px;
    }
    .modalTitle{font-weight:1000; letter-spacing:.06em; color:var(--ink); margin:2px 0 10px;}
    .modalDesc{font-size:13px; color:var(--sub); font-weight:900; margin:0 0 10px;}
    .modalRow{display:flex; gap:8px; align-items:center;}
    .modalRow input{
      flex:1;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 10px;
      font-weight:900;
      background:#fff;
    }
    .modalBtns{margin-top:10px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
    .btn{
      border:1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-weight:1000;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      cursor:pointer;
      white-space: nowrap;
    }
    .btn:hover{border-color:var(--gold)}
    .btnPrimary{
      border-color: var(--gold);
      background: #fff7e6;
    }
  /* ... 기존 CSS ... */

  /* ===== Saved cards list ===== */
  .savedWrap{margin-top:16px}
  .savedHead{
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin:10px 0 10px;
  }
  .savedTitle{font-weight:1000; letter-spacing:.02em}
  .savedSub{font-size:12px; color:var(--sub); font-weight:900}

  .cards{display:grid; gap:12px}
  .rcard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    padding:14px;
  }
  .rTop{
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:10px;
  }
  .chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .chip{
    display:inline-flex; align-items:center; justify-content:center;
    padding:6px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fffdf7;
    font-size:12px; font-weight:1000; color:var(--ink);
  }
  .chip.mini{font-weight:900; color:var(--sub); background:#fff}

  .guestPill{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    font-size:12px; font-weight:1000; color:var(--sub);
  }
  .guestPill b{color:var(--ink)}
  .row{display:grid; grid-template-columns:74px 1fr; gap:10px; padding:7px 0; border-top:1px dashed var(--line)}
  .row:first-of-type{border-top:0}
  .k{font-size:12px; color:var(--sub); font-weight:1000}
  .v{font-size:13px; color:var(--ink); font-weight:1000}
  .v .muted{color:var(--sub); font-weight:900}
  .emptyBox{
    border:1px dashed var(--line);
    border-radius:14px;
    padding:12px;
    color:var(--sub);
    font-weight:900;
    background:#fff;
  }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1>단체 예약 - 관리자 입력</h1>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>DATE</label>
          <input id="res_date" type="date" required />
        </div>

        <div>
          <label>TIME</label>
          <div class="time-row">
            <input id="res_time_raw" type="text" inputmode="numeric" placeholder="예: 6 / 630 / 18:07" autocomplete="off" />
            <div class="time-preview" id="time_preview">--:--</div>
          </div>
        </div>

        <!-- ✅ BRANCH: 직접입력 + 선택 -->
        <div>
          <label>BRANCH</label>
          <select id="branch_select" required></select>

          <div id="branch_custom_box" style="margin-top:10px; display:none;">
            <input id="branch_custom" type="text" placeholder="BRANCH 직접입력 (예: ANT2 / DALAT)" />
            <div class="mini">* 커스텀 선택 시 입력한 값이 저장됨</div>
          </div>
        </div>

        <div>
          <label>NUMBER OF GUESTS</label>
          <input id="guests_count" type="number" min="1" step="1" required />
        </div>

        <div class="span2">
          <label>PRICE (VND)</label>
          <input id="price" type="number" min="0" step="1000"/>
        </div>

        <div class="span3">
          <label>MENU (선택 or 직접입력)</label>
          <select id="menu_select"></select>

          <div id="menu_custom_box" style="margin-top:10px; display:none;">
            <div class="two">
              <input id="menu_ko" type="text" placeholder="한국어 메뉴 직접입력" />
              <input id="menu_vi" type="text" placeholder="베트남어 메뉴 직접입력(선택)" />
            </div>
            <div class="mini">KO 입력 시 매핑표에 있으면 VI 자동 입력</div>
          </div>

          <div id="menu_preview" class="mini" style="margin-top:8px;"></div>
        </div>

        <div class="span3">
          <label>NOTE</label>
          <textarea id="note" placeholder="예: 4.3.3.3 // Chuẩn bị 13 ly kem bơ"></textarea>
        </div>

        <div class="span3">
          <label>GUIDE NAME</label>
          <input id="guide_name" type="text" placeholder="예: SHIN KOOK HO (신국호)" />
        </div>
      </div>

      <div class="actions">
        <button class="btn-ghost" id="btnClear" type="button">초기화</button>
        <button class="btn-primary" id="btnSubmit" type="button">저장</button>
      </div>

      <div class="msg" id="msg"></div>
<div class="savedWrap">
  <div class="savedHead">
    <div>
      <div class="savedTitle">최근 예약</div>
      <div class="savedSub">저장하면 자동으로 아래 카드가 갱신됩니다.</div>
    </div>
    <button class="btn-ghost" id="btnReload" type="button">새로고침</button>
  </div>

  <div id="savedMsg" class="mini"></div>
  <div class="cards" id="savedCards"></div>
</div>
    </div>
  </div>

  <!-- ✅ Password Modal -->
  <div class="modalBack" id="passModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalTitle">관리자 비밀번호</div>
      <p class="modalDesc">저장하려면 비밀번호를 입력하세요.</p>
      <div class="modalRow">
        <input id="passInput" type="password" placeholder="관리자 비밀번호" autocomplete="off"/>
      </div>
      <div class="modalBtns">
        <button class="btn" id="passCancelBtn" type="button">취소</button>
        <button class="btn btnPrimary" id="passOkBtn" type="button">확인</button>
      </div>
      <p class="mini" style="margin:10px 0 0;">※ 브라우저 탭(session)에서만 유지됩니다.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/dgv-data.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script>
    /***********************
     * ✅ 너 프로젝트로 교체
     ***********************/
    const SUPABASE_URL = DGV.config.url;
    const sb = DGV.supabase;

    /***********************
     * 한→베 메뉴 매핑
     ***********************/
    const KO_VI_MENU_MAP = {
      '김치찌개': 'Canh kim chi',
      '제육볶음': 'Heo xào',
      '제육쌈밥': 'Heo xào',
      '삼겹살': 'Thịt nướng',
      '무한삼겹': 'Thịt nướng buffet',
      '무삼': 'Thịt nướng buffet',
      '아티소백숙': 'Gà hầm atiso',
      '제육+김치찌개': 'Canh kim chi+Heo xào',
      '우렁쌈밥': 'Ốc tương xào',
      '장어구이': 'Lươn nướng',
      '닭볶음탕' : 'Gà hầm cay',
      '소고기수육세트' : 'Set thịt bò luộc',
      '사시미세트' : 'bộ sashimi',
      '묵은지등갈비찜': 'Sườn heo om kim chi',
      '짬뽕순두부' : 'Món hầm Sun',
      '묵은지 두부 수육 아티소 삼합' :'Đậu phụ, thịt luộc, kim chi, miến trộn',
    };

    const $ = (id) => document.getElementById(id);
    function setMsg(type, text){
      const el = $("msg");
      if(!text){ el.innerHTML = ""; return; }
      el.innerHTML = `<span class="${type}">${DGV.escapeHTML(text)}</span>`;
    }

    async function rpc(fn, body){
      const { data, error } = await sb.rpc(fn, body || {});
      if (error) throw error;
      return data;
    }

    function normalizeKey(s){
      return (s || "").trim().replace(/\s+/g, "");
    }

    /***********************
     * TIME 파서 + 10분 보정
     ***********************/
    function clamp(n, a, b){ return Math.min(b, Math.max(a, n)); }

    function parseLooseTimeToMinutes(raw){
      const s0 = (raw || "").trim();
      if(!s0) return null;

      const s = s0.replace(/\s+/g, "");
      let h = null, m = null;

      if(s.includes(":")){
        const parts = s.split(":");
        if(parts.length !== 2) return null;
        if(parts[0] === "") return null;
        h = Number(parts[0]);
        m = Number(parts[1]);
        if(!Number.isFinite(h) || !Number.isFinite(m)) return null;
      }else{
        if(!/^\d+$/.test(s)) return null;
        if(s.length <= 2){
          h = Number(s);
          m = 0;
        }else if(s.length === 3){
          h = Number(s.slice(0,1));
          m = Number(s.slice(1));
        }else if(s.length === 4){
          h = Number(s.slice(0,2));
          m = Number(s.slice(2));
        }else{
          return null;
        }
      }

      if(!Number.isFinite(h) || !Number.isFinite(m)) return null;
      if(h < 0 || h > 23) return null;
      if(m < 0 || m > 59) return null;

      return h * 60 + m;
    }

    function roundToNearest10(mins){
      const rounded = Math.round(mins / 10) * 10;
      return clamp(rounded, 0, 23*60 + 50);
    }

    function minutesToHHMM(mins){
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
    }

    function getNormalizedTimeHHMM(){
      const mins = parseLooseTimeToMinutes($("res_time_raw").value);
      if(mins === null) return null;
      const r = roundToNearest10(mins);
      return minutesToHHMM(r);
    }

    function updateTimePreview(){
      const t = getNormalizedTimeHHMM();
      $("time_preview").textContent = t || "--:--";
      $("time_preview").style.opacity = t ? "1" : ".6";
    }

    $("res_time_raw").addEventListener("input", updateTimePreview);
    $("res_time_raw").addEventListener("blur", () => {
      const t = getNormalizedTimeHHMM();
      if(t){
        $("res_time_raw").value = t;
        updateTimePreview();
      }
    });

    /***********************
     * MENU 드롭다운 구성
     ***********************/
    function buildMenuSelect(){
      const sel = $("menu_select");
      sel.innerHTML = "";

      const custom = document.createElement("option");
      custom.value = "__custom__";
      custom.textContent = "✍️ 직접입력 (커스텀)";
      sel.appendChild(custom);

      const keys = Object.keys(KO_VI_MENU_MAP).sort((a,b)=>a.localeCompare(b,'ko'));
      for(const ko of keys){
        const vi = KO_VI_MENU_MAP[ko];
        const opt = document.createElement("option");
        opt.value = ko;
        opt.textContent = `${ko}  —  ${vi}`;
        sel.appendChild(opt);
      }

      sel.value = "__custom__";
      applyMenuMode();
    }

    function applyMenuMode(){
      const val = $("menu_select").value;
      const customBox = $("menu_custom_box");
      const preview = $("menu_preview");

      if(val === "__custom__"){
        customBox.style.display = "block";
        const ko = ($("menu_ko").value || "").trim();
        const vi = ($("menu_vi").value || "").trim();
        preview.textContent = (ko || vi) ? `저장될 메뉴: KO="${ko}" / VI="${vi}"` : "";
      }else{
        const ko = val;
        const vi = KO_VI_MENU_MAP[normalizeKey(ko)] || "";
        $("menu_ko").value = ko;
        $("menu_vi").value = vi;
        customBox.style.display = "none";
        preview.textContent = `선택됨: KO="${ko}" / VI="${vi}"`;
      }
    }

    $("menu_select").addEventListener("change", applyMenuMode);

    $("menu_ko").addEventListener("input", () => {
      const key = normalizeKey($("menu_ko").value);
      const mapped = KO_VI_MENU_MAP[key];
      if(mapped){
        $("menu_vi").value = mapped;
      }
      if($("menu_select").value === "__custom__"){
        const ko = ($("menu_ko").value || "").trim();
        const vi = ($("menu_vi").value || "").trim();
        $("menu_preview").textContent = (ko || vi) ? `저장될 메뉴: KO="${ko}" / VI="${vi}"` : "";
      }
    });

    $("menu_vi").addEventListener("input", () => {
      if($("menu_select").value === "__custom__"){
        const ko = ($("menu_ko").value || "").trim();
        const vi = ($("menu_vi").value || "").trim();
        $("menu_preview").textContent = (ko || vi) ? `저장될 메뉴: KO="${ko}" / VI="${vi}"` : "";
      }
    });

    /***********************
     * ✅ BRANCH: 직접입력 + 선택
     ***********************/
    const BRANCH_PRESETS = ["KT","ANT","AST","엠투어","기쁨","JM","TOT","투어패밀리","빅트래블","실크로드"];

    function buildBranchSelect(){
      const sel = $("branch_select");
      sel.innerHTML = "";

      const custom = document.createElement("option");
      custom.value = "__custom__";
      custom.textContent = "✍️ 직접입력 (커스텀)";
      sel.appendChild(custom);

      for(const b of BRANCH_PRESETS){
        const opt = document.createElement("option");
        opt.value = b;
        opt.textContent = b;
        sel.appendChild(opt);
      }

      sel.value = "ANT"; // 기본값
      applyBranchMode();
    }

    function applyBranchMode(){
      const val = $("branch_select").value;
      const box = $("branch_custom_box");
      if(val === "__custom__"){
        box.style.display = "block";
        $("branch_custom").focus();
      }else{
        box.style.display = "none";
        $("branch_custom").value = "";
      }
    }

    $("branch_select").addEventListener("change", applyBranchMode);

    function getBranchValue(){
      const val = $("branch_select").value;
      if(val === "__custom__"){
        return ($("branch_custom").value || "").trim();
      }
      return val;
    }

    /***********************
     * 초기화
     ***********************/
    $("btnClear").onclick = () => {
      ["res_date","res_time_raw","guests_count","price","menu_ko","menu_vi","note","guide_name","branch_custom"].forEach(id => {
        const el = $(id);
        if(el) el.value = "";
      });

      $("menu_select").value = "__custom__";
      applyMenuMode();

      $("branch_select").value = "ANT";
      applyBranchMode();

      updateTimePreview();
      setMsg("", "");
    };

    /*************************************************
     * ✅ 저장 보호(모달 비번, sessionStorage 캐시)
     *************************************************/
    function openPassModal(){
      $("passInput").value = "";
      $("passModal").style.display = "flex";
      setTimeout(()=> $("passInput").focus(), 50);
    }
    function closePassModal(){
      $("passModal").style.display = "none";
    }
    async function verifyAdminPassword(pass){
      try{
        await DGV.signInAs("admin", pass);
        return true;
      }catch(error){
        return false;
      }
}
    async function getAdminPasswordForSave(){
  const identity = await DGV.getIdentity();
  if (identity.role === "admin") return true;

  while(true){
    const pass = await new Promise((resolve) => {
      openPassModal();

      const ok = async () => {
        const v = ($("passInput").value || "").trim();
        if(!v){ setMsg("bad","비밀번호를 입력하세요"); return; }

        closePassModal();
        cleanup();
        resolve(v);
      };

      const cancel = () => {
        closePassModal();
        cleanup();
        resolve(null);
      };

      const onKey = (e) => {
        if(e.key === "Enter") ok();
        if(e.key === "Escape") cancel();
      };

      const onBackClick = (e) => {
        if (e.target && e.target.id === "passModal") cancel();
      };

      function cleanup(){
        $("passOkBtn").removeEventListener("click", ok);
        $("passCancelBtn").removeEventListener("click", cancel);
        $("passInput").removeEventListener("keydown", onKey);
        $("passModal").removeEventListener("click", onBackClick);
      }

      $("passOkBtn").addEventListener("click", ok);
      $("passCancelBtn").addEventListener("click", cancel);
      $("passInput").addEventListener("keydown", onKey);
      $("passModal").addEventListener("click", onBackClick);
    });

    if(!pass) return null;

    const ok = await verifyAdminPassword(pass);
    if(!ok){
      alert("비밀번호가 틀렸거나 권한이 없습니다.");
      continue;
    }

    return true;
  }
}


    /***********************
     * 저장 (모달 비밀번호)
     ***********************/
    $("btnSubmit").onclick = async () => {
      const btn = $("btnSubmit");
      btn.disabled = true;

      try{
        setMsg("", "");

        const res_date = $("res_date").value;
        const res_time = getNormalizedTimeHHMM(); // ✅ 정규화된 HH:MM
        const branch = getBranchValue();          // ✅ branch 커스텀/선택 반영

        const guests_count = Number($("guests_count").value);
        const priceRaw = $("price").value;
        const price = priceRaw === "" ? null : Number(priceRaw);

        const menu_ko = ($("menu_ko").value || "").trim();
        const menu_vi = ($("menu_vi").value || "").trim();
        const note = ($("note").value || "").trim();
        const guide_name = ($("guide_name").value || "").trim();

        if(!res_date || !res_time){
          setMsg("bad","DATE / TIME은 필수야");
          return;
        }
        if(!branch){
          setMsg("bad","BRANCH를 선택하거나 직접 입력해줘");
          return;
        }
        if(!Number.isFinite(guests_count) || guests_count <= 0){
          setMsg("bad","NUMBER OF GUESTS를 숫자로 입력해줘 (예: 13)");
          return;
        }
        if(price !== null && (!Number.isFinite(price) || price < 0)){
          setMsg("bad","PRICE는 0 이상의 숫자만 가능");
          return;
        }

        // 관리자 세션이 없으면 기존 모달에서 인증한다. 비밀번호는 저장하지 않는다.
        const authenticated = await getAdminPasswordForSave();
        if(!authenticated){
          setMsg("bad","비밀번호 입력이 취소되었습니다");
          return;
        }

        const body = {
          p_res_date: res_date,
          p_res_time: res_time,
          p_guests_count: guests_count,
          p_price: price,
          p_menu_ko: menu_ko,
          p_menu_vi: menu_vi,
          p_note: note,
          p_branch: branch,
          p_guide_name: guide_name
        };

        const newId = await rpc("app_create_reservation", body);

        setMsg("ok", `저장 완료! (id: ${newId})`);
        $("btnClear").click();
        setMsg("ok", `저장 완료! (id: ${newId})`);
await refreshSavedCards();   // ✅ 저장 후 아래 카드 갱신

      }catch(e){
        const msg = (e.message || "");
        if(msg.toLowerCase().includes("forbidden")){
          setMsg("bad","비밀번호가 틀렸거나 권한이 없습니다");
        }else{
          setMsg("bad","저장 실패: " + msg);
        }
      } finally {
        btn.disabled = false;
      }
    };

 ***********************/
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, (m)=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function moneyVND(n){
  if(n === null || n === undefined || n === "") return "-";
  const x = Number(n);
  if(!Number.isFinite(x)) return "-";
  return x.toLocaleString("en-US") + " VND";
}

function setSavedMsg(t){
  $("savedMsg").textContent = t || "";
}

async function fetchRecentResvGroups(limit = 20){
  // ✅ 테이블명이 다르면 여기만 바꿔줘
  const table = "resv_groups";

  const url =
  SUPABASE_URL +
  `/rest/v1/${table}?select=id,created_at,res_date,res_time,branch,guests_count,price,menu_ko,menu_vi,guide_name,note` +
  `&order=created_at.desc,id.desc` +
  `&limit=${limit}`;

  const res = await fetch(url, {
    headers: await DGV.authHeaders()
  });

  const text = await res.text();
  let json=null; try{ json = text ? JSON.parse(text) : null; }catch{}
  if(!res.ok){
    const err = (json && (json.message || json.error)) || text || ("HTTP " + res.status);
    throw new Error(err);
  }
  return json || [];
}

function renderSavedCards(rows){
  const host = $("savedCards");
  host.innerHTML = "";

  if(!rows || rows.length === 0){
    host.innerHTML = `<div class="emptyBox">아직 표시할 예약이 없습니다.</div>`;
    return;
  }

  for(const r of rows){
    const date = esc(r.res_date || "-");
    const time = esc(r.res_time || "--:--");
    const branch = esc(r.branch || "-");
    const guests = esc(r.guests_count ?? "-");
    const price = esc(moneyVND(r.price));

    const ko = (r.menu_ko || "").trim();
    const vi = (r.menu_vi || "").trim();
    const menuMain = esc(ko || vi || "-");
    const menuSub  = esc((ko && vi) ? vi : (ko ? vi : "")); // KO 있으면 VI를 아래줄로

    const guide = esc(r.guide_name || "-");
    const note  = esc(r.note || "-");

    const card = document.createElement("div");
    card.className = "rcard";
    card.innerHTML = `
      <div class="rTop">
        <div class="chips">
          <span class="chip">${date}</span>
          <span class="chip">${time}</span>
          <span class="chip mini">${branch}</span>
        </div>
        <div class="guestPill">👥 <b>${guests}</b></div>
      </div>

      <div class="row">
        <div class="k">PRICE</div>
        <div class="v">${price}</div>
      </div>

      <div class="row">
        <div class="k">MENU</div>
        <div class="v">
          ${menuMain}
          ${menuSub ? `<div class="muted">${menuSub}</div>` : ``}
        </div>
      </div>

      <div class="row">
        <div class="k">GUIDE</div>
        <div class="v">${guide}</div>
      </div>

      <div class="row">
        <div class="k">NOTE</div>
        <div class="v">${note}</div>
      </div>
    `;
    host.appendChild(card);
  }
}

async function refreshSavedCards(){
  try{
    setSavedMsg("불러오는 중...");
    const rows = await fetchRecentResvGroups(20);
    renderSavedCards(rows);
    setSavedMsg("");
  }catch(e){
    setSavedMsg("불러오기 실패: " + (e.message || e));
    $("savedCards").innerHTML = `<div class="emptyBox">리스트를 불러올 수 없습니다.</div>`;
  }
}

$("btnReload").addEventListener("click", refreshSavedCards);

      if (!ok){ location.href = "/"; return; }
      buildMenuSelect();
      buildBranchSelect();
      updateTimePreview();
      await refreshSavedCards();
